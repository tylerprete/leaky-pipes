  <rect x="166" y="62" width="140" height="42" rx="21" fill="#c9433a" stroke="#5e1a15" stroke-width="10"/>
  <!-- water drop -->
  <path d="M336 368 C372 414 392 438 392 462 a56 56 0 0 1 -112 0 C280 438 300 414 336 368 Z" fill="url(#h2o)" stroke="#12466f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M312 452 a26 26 0 0 0 18 30" fill="none" stroke="#e4f4ff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
  </g>
