<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27343f"/><stop offset="1" stop-color="#141c22"/></linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a368"/><stop offset=".55" stop-color="#d9824a"/><stop offset="1" stop-color="#a95a2c"/></linearGradient>
    <linearGradient id="cuv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0a368"/><stop offset=".55" stop-color="#d9824a"/><stop offset="1" stop-color="#a95a2c"/></linearGradient>
    <linearGradient id="h2o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc0f5"/><stop offset="1" stop-color="#2a86cf"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(0 -34)">
  <!-- pipe in from the left, elbow down to the spout -->
