  <path d="M-20 172 H292 a68 68 0 0 1 20 3" fill="none" stroke="#ffd2a6" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <!-- joint collar and spout rim -->
  <rect x="96" y="132" width="44" height="128" rx="10" fill="url(#cu)" stroke="#5c2f15" stroke-width="10"/>
  <rect x="272" y="296" width="128" height="44" rx="10" fill="url(#cuv)" stroke="#5c2f15" stroke-width="10"/>
  <!-- valve handle -->
