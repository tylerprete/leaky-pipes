<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaky Pipes</title>
<meta name="theme-color" content="#1a232a">
<meta name="apple-mobile-web-app-title" content="Leaky Pipes">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night workbench. Dark slate table, light-blue cards, water-blue for anything you can act on. */
:root {
  --table: #1a232a;
  --panel: #24303a;
  --line: #374652;
  --ink: #eef3f6;
  --muted: #98aab6;
  --water: #3aa0e6;
  --copper: #d9864a;
  --danger: #ec6a52;
  --ok: #5fc58f;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #22303a 0%, var(--table) 60%);
  background-color: var(--table);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }

#app {
  height: 100%;
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(150px, 1fr) auto auto auto;
  grid-template-areas: "top" "board" "status" "hand" "actions";
  gap: 8px;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
}
#app > .top { grid-area: top; }
#app > .chips { grid-area: chips; }
#app > .boardwrap { grid-area: board; }
#app > .others { grid-area: others; }
#app > .status { grid-area: status; }
#app > .hand { grid-area: hand; }
#app > .actions { grid-area: actions; }
#app.with-chips { grid-template-rows: auto auto minmax(150px, 1fr) auto auto auto; grid-template-areas: "top" "chips" "board" "status" "hand" "actions"; }
#app.with-others { grid-template-rows: auto minmax(130px, 1fr) auto auto auto auto; grid-template-areas: "top" "board" "others" "status" "hand" "actions"; }
.chips[hidden], .others[hidden] { display: none !important; }

/* header */
.top { display: flex; align-items: center; gap: 12px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
.brand span { color: var(--water); margin-left: 4px; }
.meta { flex: 1; color: var(--muted); font-size: 12px; line-height: 1.25; font-variant-numeric: tabular-nums; text-align: right; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.ghost:hover { border-color: var(--muted); }

/* player chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 1 0 auto;
  min-width: 108px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  align-items: center;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  position: relative;
}
.chip .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .ct { font: 600 15px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.chip .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: #1b252d; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--water); border-radius: 2px; }
.chip .tags { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; min-height: 14px; font-size: 11px; color: var(--muted); }
.chip .tags svg { width: 13px; height: 13px; }
.chip .tag-leak { color: var(--water); font-weight: 600; }
.chip .tag-dead { color: var(--danger); font-weight: 600; }
.chip.viewing { background: #2c3b47; border-color: #5a7080; }
.chip.turn::before {
  content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--water);
}
.chip.can-play::after {
  content: ''; position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--water); box-shadow: 0 0 0 3px rgba(58,160,230,.25);
}
.chip.flash { animation: flash 1s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(236,106,82,.7); } 100% { box-shadow: 0 0 0 10px rgba(236,106,82,0); } }

/* board */
.boardwrap {
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 46px), #1d272f;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  position: relative;
}
#board { width: 100%; height: 100%; display: block; touch-action: manipulation; }
#board .tableedge { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2.5; }
#board .slot { fill: rgba(255,255,255,.025); stroke: rgba(255,255,255,.09); stroke-width: 1; stroke-dasharray: 3 3; }
#board .hit { fill: transparent; cursor: default; }
#board .hit.go { cursor: pointer; }
#board .target { fill: rgba(58,160,230,.20); stroke: var(--water); stroke-width: 3; filter: url(#glow); animation: pulse 1.4s ease-in-out infinite; pointer-events: none; }
#board .target.flipneed { stroke-dasharray: 6 4; fill: rgba(58,160,230,.08); }
#board .leakring { fill: none; stroke: var(--danger); stroke-width: 2.5; stroke-dasharray: 5 3; pointer-events: none; }
#board .lastmark { fill: var(--copper); pointer-events: none; }
#board .boardlabel { fill: var(--muted); font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; }
@keyframes pulse { 50% { stroke-opacity: .45; fill-opacity: .5; } }


/* status */
.status { min-height: 44px; display: grid; gap: 2px; align-content: center; }
.status .prompt { font-weight: 600; }
.status .log { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .log.attack { color: var(--danger); }
.status .log.repair, .status .log.found { color: var(--ok); }
.status .log.win { color: var(--water); }
.status .log { animation: logfade .8s ease forwards; }
.status .log.keep { animation: none; }
.status .log.more { font-style: italic; }
@keyframes logfade { to { opacity: 0; } }

/* hand */
.hand { display: flex; gap: 8px; justify-content: center; align-items: flex-end; min-height: 88px; padding-top: 10px; }
.hcard {
  width: min(66px, calc((100vw - 72px) / 6));
  aspect-ratio: 50 / 70;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  position: relative;
  transition: transform .15s ease;
  border-radius: 6px;
}
.hcard svg { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.hcard.sel { transform: translateY(-10px); }
.hcard.sel svg { box-shadow: 0 0 0 3px var(--water), 0 6px 14px rgba(0,0,0,.45); }
.hcard.new::after { content: 'new'; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font: 600 10px/1 var(--body); background: var(--water); color: #08223a; padding: 2px 5px; border-radius: 6px; }
.hcard.dim { opacity: .55; }
.hcard:disabled { cursor: default; }
.hand .hidden { color: var(--muted); font-size: 14px; align-self: center; }

/* actions */
.actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
@media (max-width: 420px) { .actions .btn { padding: 10px 10px; font-size: 14px; } }
.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 14px;
  min-height: 44px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn svg { width: 16px; height: 16px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.on { border-color: var(--water); background: #1f3b52; }
.btn.primary { background: var(--water); border-color: var(--water); color: #06243b; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }

/* overlays */
#overlay:empty { display: none; }
#overlay { position: fixed; inset: 0; background: rgba(10,16,20,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  width: min(520px, 100%);
  max-height: 100%;
  overflow: auto;
  padding: 20px;
  display: grid;
  gap: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.sheet h2 { margin: 0; font: 700 30px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.sheet h2 span { color: var(--water); }
.sheet h3 { margin: 6px 0 0; font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--water); }
.sheet p { margin: 0; color: #d3dde3; max-width: 62ch; }
.sheet .muted { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.seat { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.seat input {
  min-width: 0; background: #1b252d; border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--ink); font: inherit;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button.on { background: #1f3b52; color: var(--ink); }
.x { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 8px; font-size: 18px; line-height: 1; }
.rules p { font-size: 14px; }
.hero-art { display: flex; gap: 0; justify-content: center; }
.hero-art svg { width: 44px; height: 62px; }

#toast {
  position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #0f171d; border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 10px;
  font-size: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
}
#toast.show { opacity: 1; }

@media (min-width: 720px) {
  #app { padding-top: 16px; gap: 10px; }
  .brand { font-size: 26px; }
  .hcard { width: 78px; }
  .hand { min-height: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- v2 polish ---------- */
.ghost.icon { padding: 6px 8px; display: inline-flex; }
.ghost.icon svg { width: 18px; height: 18px; }
body.has-modal #app { filter: blur(2px) saturate(.8); }
#app { transition: filter .25s ease; }
.chip .nm small { font: 600 10px/1 var(--body); color: var(--muted); letter-spacing: .06em; margin-left: 4px; vertical-align: 1px; }
.chip .ct small { font-size: 12px; color: #6f8290; }
.chip .bar i { transition: width .5s cubic-bezier(.2,.8,.2,1); background: linear-gradient(90deg, #2a86c7, var(--water)); }
.chip .tags .wr { display: inline-flex; gap: 2px; }
.chip .tag-win { color: var(--water); font-weight: 700; }
.thinking { display: inline-flex; gap: 3px; margin-left: auto; }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--water); animation: think 1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

#board .pop { transform-box: fill-box; transform-origin: center; animation: pop .38s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { transform: scale(.55) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
#board .drip { transform-box: fill-box; animation: drip 1.1s ease-in infinite; }
@keyframes drip { 0% { transform: translateY(-2px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(7px); opacity: 0; } }
#board .cardghost { opacity: .42; pointer-events: none; }
#board .cardghost.over { opacity: .85; }
#board .target.over { stroke-width: 4; fill: rgba(58,160,230,.32); }
#board .botmark { fill: none; stroke: var(--copper); stroke-width: 3; pointer-events: none; animation: fadeRing 1.8s ease-out forwards; }
@keyframes fadeRing { 0% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; } }
#board .hintmark { fill: none; stroke: #f4c95d; stroke-width: 3; stroke-dasharray: 8 5; pointer-events: none; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -26; } }
#board .water { fill: none; stroke: #59c2ff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .9; pointer-events: none;
  stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: flow var(--dur) ease-in-out .2s forwards; filter: url(#glow); }
#board .water-shine { fill: none; stroke: #e9f8ff; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 16; opacity: 0; pointer-events: none;
  animation: shimmer .7s linear infinite, fadein .5s ease calc(var(--dur) + .2s) forwards; }
@keyframes flow { to { stroke-dashoffset: 0; } }
@keyframes shimmer { to { stroke-dashoffset: -21; } }
@keyframes fadein { to { opacity: .8; } }
#board .pour { animation: pour 1s ease-in-out infinite alternate; }
@keyframes pour { from { opacity: .7; } to { opacity: 1; } }

.status { cursor: pointer; border-radius: 10px; padding: 2px 4px; margin: 0 -4px; }
.status:hover { background: rgba(255,255,255,.03); }

.hcard { touch-action: none; }
.hcard .spin { display: block; width: 100%; height: 100%; transition: transform .28s cubic-bezier(.3,1.3,.5,1); }
.hcard .spin.flipped { transform: rotate(180deg); }
.hcard.hinted svg { box-shadow: 0 0 0 3px #f4c95d, 0 6px 14px rgba(0,0,0,.45); }
.hcard.lifted { opacity: .25; }
.hcard:not(:disabled):hover { transform: translateY(-4px); }
.hcard.sel:not(:disabled):hover { transform: translateY(-10px); }
.hand .hcard.deal { animation: dealin .35s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes dealin { from { transform: translateY(-40px) rotate(8deg); opacity: 0; } }
.dragghost { position: fixed; left: 0; top: 0; width: 64px; aspect-ratio: 50/70; pointer-events: none; z-index: 30; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
.dragghost svg { width: 100%; height: 100%; display: block; }

.btn { transition: background .15s, border-color .15s, transform .08s; }
.btn:active:not(:disabled) { transform: scale(.97); }

.levelrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: #d3dde3; }
.muted.warn { color: var(--danger); }
.sheet { animation: rise .28s cubic-bezier(.2,.9,.3,1) both; }
@keyframes rise { from { transform: translateY(16px) scale(.98); opacity: 0; } }
#overlay.show-pass { background: rgba(10,16,20,.94); }
.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.stats th, .stats td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.stats th:first-child, .stats td:first-child { text-align: left; }
.stats thead th { color: var(--muted); font-weight: 500; font-size: 12px; }
.stats tr.won th { color: var(--water); }
.loglist { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 14px; color: #d3dde3; max-height: 55vh; overflow: auto; }
.loglist .attack { color: var(--danger); }
.loglist .repair { color: var(--ok); }
.loglist .win { color: var(--water); font-weight: 600; }
.actions .btn svg { flex: none; }
@media (max-width: 420px) { .actions .btn { padding: 10px 9px; font-size: 14px; gap: 4px; } }

/* ---------- all boards at once ---------- */
.mainhead, .phead {
  display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 22px;
  font-size: 13px; color: var(--muted);
}
.mainhead { padding: 0 2px 6px; }
.mainhead:empty { display: none; }
.phead { padding: 0 2px 4px; font-size: 12px; }
.mainhead .nm, .phead .nm { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.mainhead .nm { flex: none; }
.mainhead .tags, .phead .tags { margin-left: auto; flex: none; }
.tags .wr { align-items: center; font: 600 13px/1 var(--display); color: var(--ink); }
.tags .wr.none { color: #66788a; }
.tags .wr svg { margin-right: 1px; }
.panel.mini { container-type: inline-size; }
@container (max-width: 150px) {
  .phead .bar, .phead .nm small, .phead .tag-leak span { display: none; }
  .phead { gap: 5px; }
}
@container (max-width: 115px) {
  .phead .wr { display: none; }
}
.mainhead .nm { font: 600 16px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.mainhead .nm small, .phead .nm small, .chip .nm small { font: 600 10px/1 var(--body); color: var(--muted); letter-spacing: .06em; margin-left: 4px; vertical-align: 1px; text-transform: none; }
.mainhead .ct, .phead .ct { font: 600 15px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.mainhead .ct small, .phead .ct small { font-size: 12px; color: #6f8290; }
.mainhead .bar, .phead .bar { flex: 1 1 0; max-width: 90px; min-width: 0; height: 4px; border-radius: 2px; background: #1b252d; overflow: hidden; }
.mainhead .bar i, .phead .bar i { display: block; height: 100%; border-radius: 2px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.mainhead .tags, .phead .tags { display: flex; gap: 6px; align-items: center; font-size: 11px; min-width: 0; overflow: hidden; }
.mainhead .tags svg, .phead .tags svg { width: 13px; height: 13px; }
.tags .wr { display: inline-flex; gap: 2px; color: var(--muted); }
.tags .nowr { white-space: nowrap; }
.tag-leak { color: var(--water); font-weight: 600; white-space: nowrap; }
.tag-dead { color: var(--danger); font-weight: 600; white-space: nowrap; }
.tag-win { color: var(--water); font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip .dot { display: inline-block; margin-right: 6px; vertical-align: 1px; }
.chip { grid-template-columns: auto 1fr auto; }
.chip .nm { grid-column: 2; }
.mainhead .ghost.tiny, .ghost.tiny { padding: 3px 8px; font-size: 12px; border-radius: 6px; margin-left: auto; }

.others {
  display: grid; gap: 8px; min-height: 0;
  grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr));
  height: clamp(112px, 21vh, 230px);
}
.panel.mini {
  position: relative; min-width: 0; min-height: 0; padding: 6px 8px 6px;
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  text-align: left; cursor: pointer;
  background: #1d272f; border: 1px solid var(--line); border-radius: 12px;
  transition: border-color .2s, background .2s;
}
.panel.mini:hover { border-color: #5a7080; }
.panel.mini.turn { border-color: rgba(58,160,230,.7); box-shadow: inset 0 0 0 1px rgba(58,160,230,.35); }
.panel.mini.can-play::after {
  content: ''; position: absolute; right: 8px; top: 8px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--water); box-shadow: 0 0 0 3px rgba(58,160,230,.25);
}
.panel.mini.flash { animation: flash 1s ease-out; }
.panel.mini.dragover { border-color: var(--water); background: #223441; }
.panel.mini .tags .nowr { display: none; }
.minisvg { width: 100%; height: 100%; display: block; pointer-events: none; }
.minisvg .tableedge { fill: none; stroke: rgba(255,255,255,.22); stroke-width: 3; }
.minisvg .slot { fill: rgba(255,255,255,.02); stroke: none; }
.minisvg .target { fill: rgba(58,160,230,.25); stroke: var(--water); stroke-width: 4; animation: pulse 1.4s ease-in-out infinite; }
.minisvg .target.flipneed { stroke-dasharray: 8 5; fill: rgba(58,160,230,.1); }
.minisvg .leakring { fill: none; stroke: var(--danger); stroke-width: 4; stroke-dasharray: 6 4; }
.minisvg .lastmark { fill: var(--copper); }
.minisvg .botmark { fill: none; stroke: var(--copper); stroke-width: 4; animation: fadeRing 2.4s ease-out forwards; }

@media (min-width: 900px) and (min-aspect-ratio: 5/4) {
  #app.with-others {
    max-width: 1360px;
    grid-template-columns: minmax(0, 1fr) clamp(240px, 27vw, 380px);
    grid-template-rows: auto minmax(150px, 1fr) auto auto auto;
    grid-template-areas: "top top" "board others" "status status" "hand hand" "actions actions";
  }
  #app.with-others .others { height: auto; grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); grid-template-rows: repeat(var(--n, 1), minmax(0, 1fr)); }
}
.mainhead .following { font: 600 12px/1 var(--body); color: var(--ink); background: color-mix(in srgb, var(--pc) 30%, transparent); border: 1px solid var(--pc); padding: 3px 7px; border-radius: 99px; }
@media (max-width: 560px) {
  .chips .chip { min-width: 0; flex: 1 1 0; padding: 6px 8px; }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Leaky Pipes rules engine — follows the Winning Moves "Classic Waterworks" (2–4 player) rulebook.
 * Pure logic, no DOM. Works in the browser (window.LP) and in Node (module.exports).
 */
(function (root) {
  'use strict';

  const DIRS = ['N', 'E', 'S', 'W'];
  const DX = { N: 0, E: 1, S: 0, W: -1 };
  const DY = { N: -1, E: 0, S: 1, W: 0 };
  const OPP = { N: 'S', E: 'W', S: 'N', W: 'E' };

  // Six pipe shapes. Cards can only be turned 180°, which maps every opening to its opposite.
  const SHAPES = {
    V: ['N', 'S'],
    H: ['E', 'W'],
    L1: ['N', 'E'],
    L2: ['N', 'W'],
    T1: ['E', 'S', 'W'],
    T2: ['N', 'E', 'S'],
  };
  const SHAPE_KIND = { V: 'straight', H: 'straight', L1: 'elbow', L2: 'elbow', T1: 'T', T2: 'T' };
  const SYMMETRIC = { V: true, H: true };

  // Rulebook: 2 players 12, 3 players 10, 4 players 8 pipe cards between valve and spout.
  const REQUIRED = { 2: 12, 3: 10, 4: 8 };
  const BOARD_W = 14;
  const BOARD_H = 7;
  // Endless table: a grid big enough that no pipeline gets near its edge, valve in the middle.
  const ENDLESS = 41;

  // Winning Moves doesn't publish the card mix. This is an estimate of the 110-card deck:
  // 4 valves + 4 spouts + 102 cards below. Edit freely.
  const DECK_SPEC = {
    iron: { V: 8, H: 8, L1: 8, L2: 8, T1: 3, T2: 3 },
    copper: { V: 6, H: 6, L1: 5, L2: 5, T1: 2, T2: 2 },
    leaky: { V: 7, H: 7, L1: 6, L2: 6, T1: 2, T2: 2 },
    caps: [
      { caps: { N: 'iron', E: 'iron', S: 'copper', W: 'iron' }, count: 3 },
      { caps: { N: 'copper', E: 'iron', S: 'iron', W: 'copper' }, count: 2 },
      { caps: { N: 'leaky', E: 'iron', S: 'copper', W: 'iron' }, count: 1 },
      { caps: { N: 'iron', E: 'leaky', S: 'iron', W: 'copper' }, count: 1 },
      { caps: { N: 'copper', E: 'iron', S: 'leaky', W: 'leaky' }, count: 1 },
    ],
  };

  // A remix found by self-play (tools/deck-search.js, tools/rules-exp.js). Same idea as the
  // original, tuned against long stretches where nobody can play: more elbows, very few T's,
  // a few fewer leaks, and wrench cards: hold one in your hand and play it to fix a leak.
  const DECK_TUNED = {
    iron: { V: 7, H: 7, L1: 12, L2: 12, T1: 1, T2: 1 },
    copper: { V: 5, H: 5, L1: 10, L2: 10, T1: 1, T2: 1 },
    leaky: { V: 5, H: 5, L1: 8, L2: 8, T1: 1, T2: 1 },
    caps: [
      { caps: { N: 'iron', E: 'iron', S: 'copper', W: 'iron' }, count: 5 },
      { caps: { N: 'copper', E: 'iron', S: 'iron', W: 'copper' }, count: 4 },
      { caps: { N: 'leaky', E: 'iron', S: 'copper', W: 'iron' }, count: 1 },
    ],
    wrenchCards: 6,
  };
  const DECKS = { classic: DECK_SPEC, tuned: DECK_TUNED };

  // ---------- random ----------
  function nextRand(game) {
    // mulberry32, state kept in the game so saved games stay reproducible
    let t = (game.rng = (game.rng + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(game, arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(nextRand(game) * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------- cards ----------
  function buildDeck(spec) {
    spec = spec || DECK_SPEC;
    const deck = [];
    let n = 0;
    for (const mat of ['iron', 'copper', 'leaky']) {
      for (const shape of Object.keys(spec[mat])) {
        for (let k = 0; k < spec[mat][shape]; k++) deck.push({ id: 'c' + n++, kind: 'pipe', mat, shape });
      }
    }
    for (const c of spec.caps) {
      for (let k = 0; k < c.count; k++) deck.push({ id: 'c' + n++, kind: 'cap', caps: Object.assign({}, c.caps) });
    }
    // Optional wrench cards: held in hand like any card; playing one repairs your leak and the
    // card itself is the discard, so no extra discard is needed.
    for (let k = 0; k < (spec.wrenchCards || 0); k++) deck.push({ id: 'c' + n++, kind: 'wrench' });
    return deck;
  }

  function openingsOf(card, flip) {
    if (card.kind === 'pipe') {
      const base = SHAPES[card.shape];
      return flip ? base.map((d) => OPP[d]) : base.slice();
    }
    if (card.kind === 'valve') return [flip ? 'E' : 'W'];
    if (card.kind === 'spout') return [flip ? 'W' : 'E'];
    return [];
  }
  function capAt(card, flip, d) {
    return card.caps[flip ? OPP[d] : d];
  }
  function sameSet(a, b) {
    return a.length === b.length && a.every((d) => b.includes(d));
  }
  function isGoodPipe(card) {
    return card.kind === 'pipe' && card.mat !== 'leaky';
  }
  // Could this good pipe go over the leaking pipe at cell i (either way up)?
  function coversLeak(b, i, card) {
    const t = b.cells[i];
    return !!t && isGoodPipe(card) && [false, true].some((f) => sameSet(openingsOf(card, f), pieceOpenings(t)));
  }
  function capHasLeak(card) {
    return card.kind === 'cap' && DIRS.some((d) => card.caps[d] === 'leaky');
  }
  function describeCard(card) {
    if (card.kind === 'cap') return capHasLeak(card) ? 'cap card (with a leaky cap)' : 'cap card';
    if (card.kind === 'valve') return 'valve';
    if (card.kind === 'wrench') return 'wrench card';
    if (card.kind === 'spout') return 'spout';
    return card.mat + ' ' + SHAPE_KIND[card.shape];
  }

  // ---------- board ----------
  function newBoard(owner, w, h, valveX, valveY, face) {
    w = w || BOARD_W;
    h = h || BOARD_H;
    const cells = new Array(w * h).fill(null);
    const valve = (valveY != null ? valveY : Math.floor(h / 2)) * w + (valveX != null ? valveX : w - 1);
    cells[valve] = { card: { id: 'valve' + owner, kind: 'valve' }, flip: face === 'E', repaired: false, wrench: false, under: [], by: owner };
    return { w, h, cells, occ: [valve], valve, last: valve, owner, spout: -1 };
  }
  // b.occ lists the occupied cells in ascending order. Tables are mostly empty (the shared one
  // is 45x45), so everything that used to scan all cells walks this list instead.
  function occOf(b) {
    if (!b.occ) {
      // boards from an old save, or built by hand
      const occ = [];
      for (let i = 0; i < b.cells.length; i++) if (b.cells[i]) occ.push(i);
      b.occ = occ;
    }
    return b.occ;
  }
  function cloneBoard(b) {
    return Object.assign({}, b, { cells: b.cells.slice(), occ: occOf(b).slice() });
  }
  // The only way a cell is written. Call it on a board you just cloned (boards are otherwise
  // treated as immutable, and several board objects can share one cells/occ pair).
  function setCell(b, i, piece) {
    if (!b.cells[i]) {
      const occ = occOf(b);
      let lo = 0;
      let hi = occ.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (occ[mid] < i) lo = mid + 1;
        else hi = mid;
      }
      occ.splice(lo, 0, i);
    }
    b.cells[i] = piece;
    ENDS.delete(b);
  }
  const ENDS = new WeakMap(); // board -> its open ends (boards don't change once built)

  // ---------- shared table ----------
  // On the shared table every pipeline lives on one grid. Each board keeps only its own cards;
  // b.foreign marks cells holding someone else's card (owner + 1) and b.reserved marks empty cells
  // that someone else's open end points into. Neither may be built on, and no opening may face
  // another pipeline's card or point at a reserved cell.
  const foreignAt = (b, n) => (b.foreign ? b.foreign[n] : 0);
  const reservedAt = (b, n) => (b.reserved ? b.reserved[n] : 0);
  function syncShared(game) {
    if (game.table !== 'shared') return;
    const P = game.players;
    const size = P[0].board.cells.length;
    const occ = P.map((pl) => occOf(pl.board));
    const ends = P.map((pl) => openEnds(pl.board).filter((e) => e.t >= 0).map((e) => e.t));
    P.forEach((pl, k) => {
      const f = new Array(size).fill(0);
      const r = new Array(size).fill(0);
      P.forEach((q, j) => {
        if (j === k) return;
        for (const i of occ[j]) f[i] = j + 1;
        for (const t of ends[j]) r[t] = j + 1;
      });
      pl.board = Object.assign({}, pl.board, { foreign: f, reserved: r });
    });
  }
  // Board r as it would look if `piece` landed on cell i of someone else's pipeline (board ob).
  function withForeignPiece(rb, ob, i, piece) {
    const f = rb.foreign.slice();
    const r = rb.reserved.slice();
    f[i] = ob.owner + 1;
    r[i] = 0;
    for (const d of pieceOpenings(piece)) {
      const n = step(ob, i, d);
      if (n >= 0 && !ob.cells[n] && !foreignAt(ob, n)) r[n] = ob.owner + 1;
    }
    return Object.assign({}, rb, { foreign: f, reserved: r });
  }
  const STRAND_OTHER_MSG = "That would leave another pipeline with no way to finish.";
  // On the shared table, a card may not wall off another pipeline completely.
  function strandsOthers(game, t, move, card) {
    if (game.table !== 'shared' || !['pipe', 'cap'].includes(move.type)) return -1;
    const ob = game.players[t].board;
    const piece = { card, flip: !!move.flip };
    const x = move.i % ob.w;
    const y = Math.floor(move.i / ob.w);
    for (let r = 0; r < game.players.length; r++) {
      if (r === t) continue;
      const rb = game.players[r].board;
      const ends = openEnds(rb).filter((e) => e.t >= 0);
      const room = game.required - progressOf(rb) + 4;
      const near = ends.some((e) => Math.abs((e.t % rb.w) - x) + Math.abs(Math.floor(e.t / rb.w) - y) <= room);
      if (!near) continue;
      if (!analyze(rb, game.required).viable) continue;
      if (!analyze(withForeignPiece(rb, ob, move.i, piece), game.required, { budget: 3000 }).viable) return r;
    }
    return -1;
  }
  function step(b, i, d) {
    const x = (i % b.w) + DX[d];
    const y = Math.floor(i / b.w) + DY[d];
    if (x < 0 || y < 0 || x >= b.w || y >= b.h) return -1;
    return y * b.w + x;
  }
  // Which way may the last pipe point into the spout? Classic: left only (the spout pours left and
  // down). Endless: away from the faucet, left or right. 'any' is kept for experiments.
  function spoutDirOk(b, d, s) {
    const rule = b.spoutRule || (b.spoutAny ? 'any' : 'west');
    if (rule === 'any') return true;
    if (rule === 'west') return d === 'W';
    if (d !== 'W' && d !== 'E') return false;
    const sx = s % b.w;
    const vx = b.valve % b.w;
    // 'cross' (shared table): pour away from your valve, on the far half of the table
    if (rule === 'cross') return d === 'W' ? sx <= vx && sx < b.w / 2 - 0.5 : sx >= vx && sx > b.w / 2 - 0.5;
    return d === 'W' ? sx <= vx : sx >= vx;
  }
  function pieceOpenings(p) {
    return openingsOf(p.card, p.flip);
  }
  function isPipeLike(p) {
    return p && p.card.kind !== 'cap';
  }

  // Openings that face an empty cell: places the pipeline can still grow.
  // (The result is cached per board: treat it as read-only.)
  function openEnds(b) {
    const hit = ENDS.get(b);
    if (hit) return hit;
    const ends = [];
    for (const i of occOf(b)) {
      const p = b.cells[i];
      if (!isPipeLike(p)) continue;
      for (const d of pieceOpenings(p)) {
        const n = step(b, i, d);
        if (n < 0 || foreignAt(b, n)) ends.push({ i, d, t: -1 });
        else if (!b.cells[n]) ends.push({ i, d, t: n });
      }
    }
    ENDS.set(b, ends);
    return ends;
  }

  function neighborsConnected(b, i) {
    const p = b.cells[i];
    const out = [];
    if (!isPipeLike(p)) return out;
    for (const d of pieceOpenings(p)) {
      const n = step(b, i, d);
      if (n < 0) continue;
      const q = b.cells[n];
      if (isPipeLike(q) && pieceOpenings(q).includes(OPP[d])) out.push(n);
    }
    return out;
  }

  function capsInUse(b, i) {
    const p = b.cells[i];
    const used = [];
    if (!p || p.card.kind !== 'cap') return used;
    for (const d of DIRS) {
      const n = step(b, i, d);
      if (n < 0) continue;
      const q = b.cells[n];
      if (isPipeLike(q) && pieceOpenings(q).includes(OPP[d])) used.push({ d, n, mat: capAt(p.card, p.flip, d) });
    }
    return used;
  }

  function pieceLeaks(b, i) {
    const p = b.cells[i];
    if (!p || p.repaired) return false;
    if (p.card.kind === 'pipe') return p.card.mat === 'leaky';
    if (p.card.kind === 'cap') return capsInUse(b, i).some((u) => u.mat === 'leaky');
    return false;
  }
  function leakAt(b) {
    for (const i of occOf(b)) if (pieceLeaks(b, i)) return i;
    return -1;
  }

  // Longest simple path (in pipe cards, valve excluded) from the valve to cell `target`.
  // Loops are allowed by the rulebook, so every card a loop carries water through counts.
  function longestPath(b, target) {
    if (target === b.valve) return 0;
    const adj = new Map();
    for (const i of occOf(b)) if (isPipeLike(b.cells[i])) adj.set(i, neighborsConnected(b, i));
    let best = -1;
    let budget = 50000;
    const seen = new Set([b.valve]);
    (function dfs(i, len) {
      if (budget-- <= 0) return;
      if (i === target) {
        if (len > best) best = len;
        return;
      }
      for (const n of adj.get(i) || []) {
        if (seen.has(n)) continue;
        seen.add(n);
        dfs(n, len + 1);
        seen.delete(n);
      }
    })(b.valve, 0);
    return best;
  }

  function progressOf(b) {
    const ends = openEnds(b).filter((e) => e.t >= 0);
    let best = 0;
    const done = new Set();
    for (const e of ends) {
      if (done.has(e.i)) continue;
      done.add(e.i);
      best = Math.max(best, longestPath(b, e.i));
    }
    if (b.spout >= 0) {
      const into = step(b, b.spout, b.spoutDir === 'E' ? 'W' : 'E');
      best = Math.max(best, longestPath(b, into));
    }
    return best;
  }

  // ---------- placement checks (pure geometry) ----------
  function fail(reason) {
    return { ok: false, reason };
  }

  function evalPipe(b, i, card, flip) {
    if (i < 0 || b.cells[i] || foreignAt(b, i)) return fail('That spot is taken.');
    if (reservedAt(b, i)) return fail("That spot is in front of another pipeline's open end.");
    const O = openingsOf(card, flip);
    const conns = [];
    for (const d of DIRS) {
      const n = step(b, i, d);
      const open = O.includes(d);
      if (n < 0) {
        if (open) return fail("A pipe can't point off the edge of the table.");
        continue;
      }
      if (foreignAt(b, n)) {
        if (open) return fail("A pipe can't run into another pipeline.");
        continue;
      }
      const q = b.cells[n];
      if (!q) {
        if (open && reservedAt(b, n)) return fail('That would point at a spot another pipeline needs.');
        continue;
      }
      if (q.card.kind === 'cap') {
        if (open) return fail("A pipe can't run into a cap card.");
        continue;
      }
      const qOpen = pieceOpenings(q).includes(OPP[d]);
      if (open && qOpen) conns.push({ d, n });
      else if (open !== qOpen) return fail("The pipes don't line up.");
    }
    if (!conns.length) return fail('It has to connect to an open pipe end.');
    const nb = cloneBoard(b);
    setCell(nb, i, { card, flip, repaired: false, wrench: false, under: [], by: -1 });
    if (!openEnds(nb).length) return fail('That would completely block the pipeline.');
    return { ok: true, conns };
  }

  function evalCap(b, i, card, flip) {
    if (i < 0 || b.cells[i] || foreignAt(b, i)) return fail('That spot is taken.');
    if (reservedAt(b, i)) return fail("That spot is in front of another pipeline's open end.");
    const used = [];
    for (const d of DIRS) {
      const n = step(b, i, d);
      if (n < 0) continue;
      const q = b.cells[n];
      if (isPipeLike(q) && pieceOpenings(q).includes(OPP[d])) used.push({ d, n, mat: capAt(card, flip, d) });
    }
    if (!used.length) return fail('A cap has to close an open pipe end.');
    const nb = cloneBoard(b);
    setCell(nb, i, { card, flip, repaired: false, wrench: false, under: [], by: -1 });
    if (!openEnds(nb).length) return fail("A cap can't stop the water: another open end must remain.");
    return { ok: true, used };
  }

  // Ends an opponent may attack: those of the last card played, or any end if that card has none left.
  function attackCells(b) {
    const ends = openEnds(b).filter((e) => e.t >= 0);
    const fromLast = ends.filter((e) => e.i === b.last);
    return new Set((fromLast.length ? fromLast : ends).map((e) => e.i));
  }

  // House rule for a gap in the rulebook: a leak may slow an opponent down, but it may not
  // steer their pipeline into a spot where it can never be finished.
  const STRAND_MSG = "House rule: a leak can't leave their pipeline with no way to finish.";
  function strandsOpponent(game, b, move, card, actor) {
    if (!analyze(b, game.required).viable) return false;
    return !analyze(boardAfter(b, move, card, actor), game.required, { budget: 4000 }).viable;
  }

  // ---------- move legality (rules for owner vs opponent) ----------
  // move: {type:'pipe'|'cap'|'cover'|'wrench'|'discard', cardId, target, i, flip}
  function checkMove(game, p, move) {
    const me = game.players[p];
    if (game.phase === 'over') return fail('The game is over.');
    if (game.turn !== p) return fail("It isn't your turn.");
    if (game.phase === 'wrenchDiscard' && move.type !== 'discard') return fail('Discard a card to finish your wrench repair.');

    if (move.type === 'wrench') {
      const b = me.board;
      const leak = leakAt(b);
      if (leak < 0) return fail('Nothing on your pipeline is leaking.');
      if (move.i !== leak) return fail('Put the wrench on the leaking card.');
      if (move.cardId) {
        const c = me.hand.find((x) => x.id === move.cardId);
        if (!c || c.kind !== 'wrench') return fail('That is not a wrench card.');
        return { ok: true };
      }
      if (me.wrenches <= 0) return fail('You have no wrenches left.');
      return { ok: true };
    }

    if (move.type === 'pass') return me.hand.length === 0 ? { ok: true } : fail('You still have cards to play or discard.');
    const card = me.hand.find((c) => c.id === move.cardId);
    if (!card) return fail("That card isn't in your hand.");
    if (move.type === 'discard') return { ok: true };
    if (card.kind === 'wrench') return fail('A wrench card can only repair a leak on your own pipeline.');

    const tp = game.players[move.target];
    if (!tp) return fail('No such player.');
    const b = tp.board;
    const own = move.target === p;
    const leak = leakAt(b);

    if (move.type === 'pipe') {
      if (card.kind !== 'pipe') return fail('That is not a pipe card.');
      if (own) {
        if (card.mat === 'leaky') return fail("You can't put a leaky pipe on your own pipeline.");
        if (leak >= 0) return fail('Repair your leak before adding to your pipeline.');
        const r = evalPipe(b, move.i, card, move.flip);
        if (r.ok && strandsOthers(game, p, move, card) >= 0) return fail(STRAND_OTHER_MSG);
        return r;
      }
      if (card.mat !== 'leaky') return fail("You can't play a good pipe on an opponent's pipeline.");
      if (leak >= 0) return fail('That pipeline already has a leak.');
      const r = evalPipe(b, move.i, card, move.flip);
      if (!r.ok) return r;
      const atk = attackCells(b);
      if (!r.conns.some((c) => atk.has(c.n))) return fail('A leaky pipe must go next to the last card played.');
      if (strandsOpponent(game, b, move, card, p)) return fail(STRAND_MSG);
      if (strandsOthers(game, move.target, move, card) >= 0) return fail(STRAND_OTHER_MSG);
      return r;
    }

    if (move.type === 'cap') {
      if (card.kind !== 'cap') return fail('That is not a cap card.');
      const r = evalCap(b, move.i, card, move.flip);
      if (!r.ok) return r;
      if (own) {
        if (leak >= 0) {
          const lp = b.cells[leak];
          const leakyT = lp.card.kind === 'pipe' && pieceOpenings(lp).length === 3;
          if (!leakyT) return fail('Repair your leak before adding to your pipeline.');
          if (!r.used.every((u) => u.n === leak && u.mat !== 'leaky')) return fail('Only a good cap on the leaky T is allowed until it is repaired.');
        }
        if (strandsOthers(game, p, move, card) >= 0) return fail(STRAND_OTHER_MSG);
        return r;
      }
      if (leak >= 0) return fail('That pipeline already has a leak.');
      if (!r.used.some((u) => u.mat === 'leaky')) return fail('On an opponent you can only play a leaky cap.');
      const atk = attackCells(b);
      if (!r.used.some((u) => atk.has(u.n))) return fail('A leaky cap must go next to the last card played.');
      if (strandsOpponent(game, b, move, card, p)) return fail(STRAND_MSG);
      if (strandsOthers(game, move.target, move, card) >= 0) return fail(STRAND_OTHER_MSG);
      return r;
    }

    if (move.type === 'cover') {
      const target = b.cells[move.i];
      if (!target) return fail('There is no card there.');
      if (own) {
        if (move.i !== leak) return fail('You can only cover the leaking card.');
        if (target.card.kind === 'pipe') {
          if (!isGoodPipe(card)) return fail('Cover a leak with a good pipe of the same shape.');
          if (!sameSet(openingsOf(card, move.flip), pieceOpenings(target))) return fail('It must be exactly the same shape.');
          return { ok: true };
        }
        if (target.card.kind === 'cap') {
          if (card.kind !== 'cap') return fail('Cover a leaky cap with a good cap card.');
          const used = capsInUse(b, move.i);
          if (used.some((u) => capAt(card, move.flip, u.d) === 'leaky')) return fail('The caps in use must all be good.');
          return { ok: true };
        }
        return fail("That card can't be covered.");
      }
      if (card.kind !== 'pipe' || card.mat !== 'leaky') return fail('Only a leaky pipe can go on top of an opponent card.');
      if (leak >= 0) return fail('That pipeline already has a leak.');
      if (move.i !== b.last) return fail('A leaky pipe can only go on top of the last card played.');
      if (target.card.kind !== 'pipe') return fail('Only a pipe card can be made to leak.');
      if (target.card.mat === 'copper') return fail("Copper pipes can't leak.");
      if (target.card.mat !== 'iron' || target.repaired) return fail('A repaired pipe can\'t leak again.');
      if (!sameSet(openingsOf(card, move.flip), pieceOpenings(target))) return fail('It must be exactly the same shape.');
      return { ok: true };
    }
    return fail('Unknown move.');
  }

  // Apply a placement to a board (no hand/turn bookkeeping). Returns the new board.
  function boardAfter(b, move, card, actor) {
    const nb = cloneBoard(b);
    if (move.type === 'pipe') {
      setCell(nb, move.i, { card, flip: !!move.flip, repaired: false, wrench: false, under: [], by: actor });
      nb.last = move.i;
    } else if (move.type === 'cap') {
      setCell(nb, move.i, { card, flip: !!move.flip, repaired: false, wrench: false, under: [], by: actor });
    } else if (move.type === 'cover') {
      const old = nb.cells[move.i];
      const ownRepair = actor === b.owner;
      setCell(nb, move.i, {
        card,
        flip: !!move.flip,
        repaired: ownRepair,
        wrench: false,
        under: old.under.concat([{ card: old.card, flip: old.flip, wrench: old.wrench }]),
        by: actor,
      });
    } else if (move.type === 'wrench') {
      const old = nb.cells[move.i];
      setCell(nb, move.i, Object.assign({}, old, { wrench: true, repaired: true }));
    }
    return nb;
  }

  // ---------- winning ----------
  // Returns the cell where the spout goes, or -1. Rulebook: leak-free, no second open sections,
  // at least `required` pipe cards in one line, spout pouring left and down (line ends heading left).
  function spoutCell(b, required) {
    if (leakAt(b) >= 0) return -1;
    const ends = openEnds(b);
    if (ends.length !== 1) return -1;
    const e = ends[0];
    if (e.t < 0 || reservedAt(b, e.t) || !spoutDirOk(b, e.d, e.t)) return -1;
    if (longestPath(b, e.i) < required) return -1;
    return e.t;
  }

  // ---------- dead-end analysis ----------
  // Can this pipeline still be finished, given an unlimited supply of good cards and caps?
  // Searches, for each open end, for a free path of at least the needed length that ends
  // heading left into a free spout cell. Other open ends must be capped or merged with a T.
  function analyze(b, required, opts) {
    opts = opts || {};
    const ends = openEnds(b);
    const res = { viable: false, cost: Infinity };
    if (!ends.length) return res;
    if (ends.some((e) => e.t < 0)) return res;
    const byTarget = new Map();
    for (const e of ends) {
      if (!byTarget.has(e.t)) byTarget.set(e.t, []);
      byTarget.get(e.t).push(e);
    }
    const depthCache = new Map();
    const depth = (i) => {
      if (!depthCache.has(i)) depthCache.set(i, longestPath(b, i));
      return depthCache.get(i);
    };
    for (const E of ends) {
      const needed = Math.max(0, required - depth(E.i));
      const ok = pathSearch(b, E, needed, byTarget, opts.budget || 2500);
      if (!ok) continue;
      res.viable = true;
      const rule = b.spoutRule || (b.spoutAny ? 'any' : 'west');
      const turn = rule === 'any' ? 0 : rule === 'away' || rule === 'cross' ? (E.d === 'W' || E.d === 'E' ? 0 : 1) : E.d === 'W' ? 0 : E.d === 'E' ? 2 : 1;
      let reach = 0;
      if (rule === 'cross') {
        const tx = E.t % b.w;
        const west = b.valve % b.w > b.w / 2;
        const goal = west ? Math.ceil(b.w / 2 - 0.5) - 1 : Math.floor(b.w / 2 - 0.5) + 1;
        reach = Math.max(0, west ? tx - goal : goal - tx);
      }
      const others = new Set(ends.filter((x) => x !== E && x.t !== E.t).map((x) => x.t));
      const cost = Math.max(needed, turn, reach) + others.size;
      if (cost < res.cost) res.cost = cost;
    }
    return res;
  }

  function pathSearch(b, E, needed, byTarget, budget) {
    const free = (i) => i >= 0 && !b.cells[i] && !foreignAt(b, i) && !reservedAt(b, i);
    const othersAt = (i) => (byTarget.get(i) || []).filter((x) => x !== E);
    const spoutOk = (s, visited) => free(s) && !visited.has(s) && !byTarget.has(s);
    // Zero more cards: spout goes straight onto this end.
    if (needed === 0 && spoutDirOk(b, E.d, E.t) && othersAt(E.t).length === 0) return true;
    const visited = new Set([E.t]);
    let nodes = 0;
    let exhausted = false;
    const cellOk = (i) => othersAt(i).length <= 1; // one extra end can merge through a T
    if (!free(E.t) || !cellOk(E.t)) return false;

    function reach(from, cap) {
      // count free unvisited cells reachable from `from` (stop at cap)
      const q = [from];
      const seen = new Set([from]);
      let c = 0;
      while (q.length && c < cap) {
        const i = q.pop();
        for (const d of DIRS) {
          const n = step(b, i, d);
          if (!free(n) || seen.has(n) || visited.has(n)) continue;
          seen.add(n);
          c++;
          q.push(n);
        }
      }
      return c;
    }

    function dfs(cell, len, inSide) {
      if (++nodes > budget) {

        return true; // be optimistic when the search runs long
      }
      if (len >= needed) {
        for (const d of DIRS) {
          if (d === inSide) continue;
          const sc = step(b, cell, d);
          if (spoutDirOk(b, d, sc) && spoutOk(sc, visited)) return true;

      const remaining = needed - len;
      if (remaining > 0 && reach(cell, remaining + 1) < remaining + 1) return false;
      if (len > needed + 8) return false;
      for (const d of ['W', 'N', 'S', 'E']) {
        if (d === inSide) continue;
        const n = step(b, cell, d);
        if (!free(n) || visited.has(n) || !cellOk(n)) continue;
        visited.add(n);
        if (dfs(n, len + 1, OPP[d])) return true;
        visited.delete(n);
      }
      return false;
    }
    const r = dfs(E.t, 1, OPP[E.d]);
    return r || exhausted;
  }

  function packGame(game) {

      }),

    return game;
  }

  const poss = (n) => (n === 'You' ? 'your' : n + "'s");
  const an = (w) => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;

  function log(game, text, kind) {
    game.seq++;
    game.log.push({ n: game.seq, text, kind: kind || 'info', p: game.turn });
    if (game.log.length > 60) game.log.shift();

  function drawCard(game) {
    if (!game.deck.length && game.discard.length) {

  }

  function startTurn(game, noDraw) {

    game.turns++;

  }

  function removeFromHand(pl, id) {

  }

  function applyMove(game, p, move) {

    if (game.phase === 'play') {

      return endTurn(game);
    }
    if (move.type === 'wrench') {

        return endTurn(game);
      }
      me.wrenches--;
      log(game, who + ' fixed a leak with a wrench.', 'repair');
      if (!me.hand.length) return endTurn(game);
      game.phase = 'wrenchDiscard';
      return { ok: true, needDiscard: true };
    }
    const card = removeFromHand(me, move.cardId);
    const tp = game.players[move.target];
    tp.board = boardAfter(tp.board, move, card, p);
    syncShared(game);
    const own = move.target === p;
    if (own) {
      if (move.type === 'cover') log(game, who + ' repaired a leak with ' + an(describeCard(card)) + '.', 'repair');
      else log(game, who + ' added ' + an(describeCard(card)) + '.');
    } else {
      const whom = tp.name;
      if (move.type === 'cover') log(game, who + ' made ' + poss(whom) + ' pipe leak!', 'attack');
      else log(game, who + ' put ' + an(describeCard(card)) + ' on ' + poss(whom) + ' pipeline!', 'attack');
    }
    return endTurn(game);
  }

  function endTurn(game) {
    const p = game.turn;
    const me = game.players[p];
    const s = spoutCell(me.board, game.required);
    if (s >= 0) {
      const nb = cloneBoard(me.board);
      const dir = openEnds(me.board)[0].d;
      setCell(nb, s, { card: { id: 'spout' + p, kind: 'spout' }, flip: dir === 'E', repaired: false, wrench: false, under: [], by: p });
      nb.spout = s;
      nb.spoutDir = dir;
      me.board = nb;
      syncShared(game);
      game.winner = p;
      game.phase = 'over';
      log(game, me.name + ' added the spout and ' + (me.name === 'You' ? 'win' : 'wins') + '!', 'win');
      return { ok: true, won: true };
    }
    // Everyone stuck with nothing left to draw: call it.
    if (game.turns > 600) {
      game.phase = 'over';
      game.winner = -1;
      log(game, 'The game ran out of steam. No winner.', 'win');
      return { ok: true, over: true };
    }
    game.turn = (p + 1) % game.players.length;
    startTurn(game);
    return { ok: true };
  }

  // Every legal move for player p (used by bots and to highlight targets).
  function legalMoves(game, p, onlyCardId) {
    const me = game.players[p];
    const moves = [];
    if (game.phase === 'over' || game.turn !== p) return moves;
    if (game.phase === 'wrenchDiscard') {

      a = o;
    }
    return 1 / (1 + Math.exp(-a[0]));
  }

  const PARAMS = {
    fit: 0.6, // value of holding cards that can extend the pipeline next turn
    fitDecay: 0.5, // each extra fitting card is worth this fraction of the previous one
    exposed: 0.25, // penalty: last card is iron (an opponent can drop a same-shape leak on it)
    space: 0.15, // value of free room around the growing end (log scale)
    ammo: 0.15, // value per leaky card held, up to ammoMax
    ammoMax: 2,
    capHeld: 0.3, // value of holding a good cap while a T is open
    wrench: 0.45, // value of each unused wrench
    leakMine: 1.2, // cost of a leak on my own pipeline (turns), more if no way to fix in hand
    leakTheirs: 1.0, // turns a leak costs an opponent who still has a wrench
    leakTheirsNoWrench: 1.8,
    atk: 1.0, // attack weight in 2-player games
    nonLeader: 0.45, // multiplier for hurting someone who isn't the leader (3–4 players)
    race: 0.25, // extra attack weight per turn the target is ahead of me
    tPenalty: 0.15,
    block: 0, // shared table: weight on how much a placement crowds other pipelines (0 = ignore)
    west: 0, // pull toward a left-heading line near the finish (set per table below)
    westWithin: 4,
    noise: 0,
  };

  const CAP = 30; // stand-in for "can't finish"

  function makeBot(overrides) {
    const P = Object.assign({}, PARAMS, overrides || {});
    const rnd = (game) => (P.noise ? (LP.nextRand(game) - 0.5) * P.noise : 0);

    const cache = new WeakMap();
    function analyzeCost(game, b) {
      let c = cache.get(b);
      if (c === undefined) {
        const a = LP.analyze(b, game.required);
        c = a.viable ? a.cost : CAP;
        cache.set(b, c);
      }
      return c;
    }

    // Can this card extend board b for its owner right now? (ignores leaks)
    function fits(b, card) {
      if (card.kind === 'pipe' && card.mat === 'leaky') return false;
      const targets = new Set(LP.openEnds(b).filter((e) => e.t >= 0).map((e) => e.t));
      const flips = card.kind === 'pipe' && (card.shape === 'V' || card.shape === 'H') ? [false] : [false, true];
      for (const i of targets) {
        for (const f of flips) {
          const r = card.kind === 'cap' ? LP.evalCap(b, i, card, f) : LP.evalPipe(b, i, card, f);
          if (!r.ok) continue;
          if (card.kind === 'cap') return LP.openEnds(b).length > 1;
          return true;
        }
      }
      return false;
    }

    function myValue(game, p, b, hand, wrenches) {
      for (const c of hand) if (c.kind === 'wrench') wrenches++; // a wrench card is a wrench in waiting
      const cost = analyzeCost(game, b);
      let v = -cost;
      // hand fit
      let n = 0;
      for (const c of hand) if (c.kind === 'pipe' && c.mat !== 'leaky' && LP.SHAPE_KIND[c.shape] !== 'T' && fits(b, c)) n++;
      v += P.fit * (n ? (1 - Math.pow(P.fitDecay, n)) / (1 - P.fitDecay) : 0);
      // leak on my pipeline
      const leak = LP.leakAt(b);
      if (leak >= 0) {
        const piece = b.cells[leak];
        const canCover = hand.some((c) =>
          piece.card.kind === 'pipe'
            ? c.kind === 'pipe' && c.mat !== 'leaky' && sameShapeAs(c, piece)
            : c.kind === 'cap' && !LP.capHasLeak(c)
        );
        v -= canCover || wrenches > 0 ? P.leakMine : P.leakMine + 1.2;
      }
      // exposure of the last card to an on-top leak
      const last = b.cells[b.last];

      // room to grow
      if (cost < CAP) v += P.space * Math.log2(1 + Math.min(16, freeAround(b)));

      v += P.ammo * Math.min(leaky, P.ammoMax);
      const openEnds = LP.openEnds(b).length;

      if (openEnds > 1) v -= P.tPenalty;

    const SIDE = 13;
    function sideFeatures(game, i, p) {

        dead ? 1 : 0,

        wcards,
        fit,

        hand.some((c) => c.kind === 'cap' && !LP.capHasLeak(c)) ? 1 : 0,
        ends > 1 ? 1 : 0,
        dead ? 0 : Math.log2(1 + Math.min(16, freeAround(b))),
        last && last.card.kind === 'pipe' && last.card.mat === 'iron' && !last.repaired ? 1 : 0,

    }
    // me, then my most dangerous opponent, then the table
    function features(game, p) {

      const vals = game.players.map((pl, i) => (i === p ? null : theirValue(game, i, pl.board)));

    function theirValue(game, t, b) {

    function sameShapeAs(card, piece) {

    function freeAround(b) {

          if (LP.spoutCell(nb, game.required) >= 0) s += 100;
          consider(m, s + crowding(game, p, m, card, myCostNow, costs, theirBase));
        } else {

          const nb = LP.boardAfter(tp.board, m, card, p);
          const lost = theirBase[m.target] - theirValue(game, m.target, nb);
          const mine = myValue(game, p, me.board, without(m.cardId), me.wrenches) - base;
          consider(m, mine + attackWeight(game, p, m.target, myCostNow, costs) * lost + crowding(game, p, m, card, myCostNow, costs, theirBase));

    }

    // Shared table: a card on the grid also takes room from nearby pipelines.
    function crowding(game, p, m, card, myCostNow, costs, theirBase) {
      if (!P.block || game.table !== 'shared' || (m.type !== 'pipe' && m.type !== 'cap')) return 0;
      const ob = game.players[m.target].board;
      const x = m.i % ob.w;
      const y = Math.floor(m.i / ob.w);
      let total = 0;
      game.players.forEach((pl, r) => {
        if (r === p || r === m.target) return;
        const rb = pl.board;
        const near = LP.openEnds(rb).some((e) => e.t >= 0 && Math.abs((e.t % rb.w) - x) + Math.abs(Math.floor(e.t / rb.w) - y) <= 4);
        if (!near) return;

        const room = (b) => Math.log2(1 + Math.min(16, freeAround(b)));
        const lost = theirBase[r] - theirValue(game, r, nb) + 2 * P.space * (room(rb) - room(nb));

    }

    function chooseMove(game, p) {
      const me = game.players[p];
      if (game.phase === 'wrenchDiscard') return { type: 'discard', cardId: worstCard(game, p, me.hand, me.board, me.wrenches) };
      if (!me.hand.length) return LP.legalMoves(game, p).find((m) => m.type === 'wrench') || { type: 'pass' };
      const scored = scoreMoves(game, p);
      let best = null;
      for (const x of scored) if (!best || x.score > best.score) best = x;
      return best ? best.m : { type: 'discard', cardId: me.hand[0].id };
    }

    function worstCard(game, p, hand, board, wrenches) {
      let worst = null;
      for (const c of hand) {
        const rest = hand.filter((h) => h !== c);
        const v = myValue(game, p, board, rest, wrenches) + (LP.nextRand(game) - 0.5) * 1e-6;
        // dropping the card that leaves the best hand behind
        if (!worst || v > worst.v) worst = { id: c.id, v };
      }
      return worst ? worst.id : hand[0] && hand[0].id;

    return { params: P, chooseMove, scoreMoves, fits, features, myValue };
  }

  // ---------------------------------------------------------------- search
  // Hard level: take the heuristic's best few moves and play each forward a few rounds against

    }
    function evalOld(g, p) {
