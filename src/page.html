<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaky Pipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*STYLE*/
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#dcedf8"/>
      <stop offset="1" stop-color="#b9d8ec"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
<div id="app">
  <header class="top">
    <div class="brand" aria-label="Leaky Pipes">Leaky<span>Pipes</span></div>
    <div class="meta" id="meta"></div>
    <button class="ghost" id="menuBtn" type="button">Menu</button>
  </header>
  <nav class="chips" id="chips" aria-label="Pipelines"></nav>
  <main class="boardwrap" id="boardwrap">
    <div class="viewing-note" id="viewnote"></div>
    <svg id="board" role="img" aria-label="Pipeline board"></svg>
  </main>
  <div class="status" id="status" aria-live="polite"></div>
  <section class="hand" id="hand" aria-label="Your hand"></section>
  <div class="actions" id="actions"></div>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*ENGINE*/
</script>
<script>
/*BOT*/
</script>
<script>
/*UI*/
</script>
</body>
</html>
