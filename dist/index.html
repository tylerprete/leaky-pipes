<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaky Pipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night workbench. Dark slate table, light-blue cards, water-blue for anything you can act on. */
:root {
  --table: #1a232a;
  --panel: #24303a;
  --line: #374652;
  --ink: #eef3f6;
  --muted: #98aab6;
  --water: #3aa0e6;
  --copper: #d9864a;
  --danger: #ec6a52;
  --ok: #5fc58f;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #22303a 0%, var(--table) 60%);
  background-color: var(--table);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }

#app {
  height: 100%;
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto auto minmax(150px, 1fr) auto auto auto;
  gap: 8px;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
}

/* header */
.top { display: flex; align-items: center; gap: 12px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
.brand span { color: var(--water); margin-left: 4px; }
.meta { flex: 1; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.ghost:hover { border-color: var(--muted); }

/* player chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 1 0 auto;
  min-width: 108px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  align-items: center;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  position: relative;
}
.chip .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .ct { font: 600 15px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.chip .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: #1b252d; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--water); border-radius: 2px; }
.chip .tags { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; min-height: 14px; font-size: 11px; color: var(--muted); }
.chip .tags svg { width: 13px; height: 13px; }
.chip .tag-leak { color: var(--water); font-weight: 600; }
.chip .tag-dead { color: var(--danger); font-weight: 600; }
.chip.viewing { background: #2c3b47; border-color: #5a7080; }
.chip.turn::before {
  content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--water);
}
.chip.can-play::after {
  content: ''; position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--water); box-shadow: 0 0 0 3px rgba(58,160,230,.25);
}
.chip.flash { animation: flash 1s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(236,106,82,.7); } 100% { box-shadow: 0 0 0 10px rgba(236,106,82,0); } }

/* board */
.boardwrap {
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 46px), #1d272f;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  position: relative;
}
#board { width: 100%; height: 100%; display: block; touch-action: manipulation; }
#board .tableedge { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2.5; }
#board .slot { fill: rgba(255,255,255,.025); stroke: rgba(255,255,255,.09); stroke-width: 1; stroke-dasharray: 3 3; }
#board .hit { fill: transparent; cursor: default; }
#board .hit.go { cursor: pointer; }
#board .target { fill: rgba(58,160,230,.20); stroke: var(--water); stroke-width: 3; filter: url(#glow); animation: pulse 1.4s ease-in-out infinite; pointer-events: none; }
#board .target.flipneed { stroke-dasharray: 6 4; fill: rgba(58,160,230,.08); }
#board .leakring { fill: none; stroke: var(--danger); stroke-width: 2.5; stroke-dasharray: 5 3; pointer-events: none; }
#board .lastmark { fill: var(--copper); pointer-events: none; }
#board .boardlabel { fill: var(--muted); font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; }
@keyframes pulse { 50% { stroke-opacity: .45; fill-opacity: .5; } }
.viewing-note { position: absolute; left: 12px; top: 10px; z-index: 1; background: rgba(26,35,42,.82); padding: 5px 8px; border-radius: 6px; font: 600 13px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); pointer-events: none; }

/* status */
.status { min-height: 44px; display: grid; gap: 2px; align-content: center; }
.status .prompt { font-weight: 600; }
.status .log { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .log.attack { color: var(--danger); }
.status .log.repair { color: var(--ok); }
.status .log.win { color: var(--water); }

/* hand */
.hand { display: flex; gap: 8px; justify-content: center; align-items: flex-end; min-height: 88px; padding-top: 10px; }
.hcard {
  width: min(66px, calc((100vw - 72px) / 6));
  aspect-ratio: 50 / 70;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  position: relative;
  transition: transform .15s ease;
  border-radius: 6px;
}
.hcard svg { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.hcard.sel { transform: translateY(-10px); }
.hcard.sel svg { box-shadow: 0 0 0 3px var(--water), 0 6px 14px rgba(0,0,0,.45); }
.hcard.new::after { content: 'new'; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font: 600 10px/1 var(--body); background: var(--water); color: #08223a; padding: 2px 5px; border-radius: 6px; }
.hcard.dim { opacity: .55; }
.hcard:disabled { cursor: default; }
.hand .hidden { color: var(--muted); font-size: 14px; align-self: center; }

/* actions */
.actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
@media (max-width: 420px) { .actions .btn { padding: 10px 10px; font-size: 14px; } }
.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 14px;
  min-height: 44px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn svg { width: 16px; height: 16px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.on { border-color: var(--water); background: #1f3b52; }
.btn.primary { background: var(--water); border-color: var(--water); color: #06243b; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }

/* overlays */
#overlay:empty { display: none; }
#overlay { position: fixed; inset: 0; background: rgba(10,16,20,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  width: min(520px, 100%);
  max-height: 100%;
  overflow: auto;
  padding: 20px;
  display: grid;
  gap: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.sheet h2 { margin: 0; font: 700 30px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.sheet h2 span { color: var(--water); }
.sheet h3 { margin: 6px 0 0; font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--water); }
.sheet p { margin: 0; color: #d3dde3; max-width: 62ch; }
.sheet .muted { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.seat { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.seat input {
  min-width: 0; background: #1b252d; border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--ink); font: inherit;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button.on { background: #1f3b52; color: var(--ink); }
.x { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 8px; font-size: 18px; line-height: 1; }
.rules p { font-size: 14px; }
.hero-art { display: flex; gap: 0; justify-content: center; }
.hero-art svg { width: 44px; height: 62px; }

#toast {
  position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #0f171d; border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 10px;
  font-size: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
}
#toast.show { opacity: 1; }

@media (min-width: 720px) {
  #app { padding-top: 16px; gap: 10px; }
  .brand { font-size: 26px; }
  .hcard { width: 78px; }
  .hand { min-height: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#dcedf8"/>
      <stop offset="1" stop-color="#b9d8ec"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
<div id="app">
  <header class="top">
    <div class="brand" aria-label="Leaky Pipes">Leaky<span>Pipes</span></div>
    <div class="meta" id="meta"></div>
    <button class="ghost" id="menuBtn" type="button">Menu</button>
  </header>
  <nav class="chips" id="chips" aria-label="Pipelines"></nav>
  <main class="boardwrap" id="boardwrap">
    <div class="viewing-note" id="viewnote"></div>
    <svg id="board" role="img" aria-label="Pipeline board"></svg>
  </main>
  <div class="status" id="status" aria-live="polite"></div>
  <section class="hand" id="hand" aria-label="Your hand"></section>
  <div class="actions" id="actions"></div>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Leaky Pipes rules engine — follows the Winning Moves "Classic Waterworks" (2–4 player) rulebook.
 * Pure logic, no DOM. Works in the browser (window.LP) and in Node (module.exports).
 */
(function (root) {
  'use strict';

  const DIRS = ['N', 'E', 'S', 'W'];
  const DX = { N: 0, E: 1, S: 0, W: -1 };
  const DY = { N: -1, E: 0, S: 1, W: 0 };
  const OPP = { N: 'S', E: 'W', S: 'N', W: 'E' };

  // Six pipe shapes. Cards can only be turned 180°, which maps every opening to its opposite.
  const SHAPES = {
    V: ['N', 'S'],
    H: ['E', 'W'],
    L1: ['N', 'E'],
    L2: ['N', 'W'],
    T1: ['E', 'S', 'W'],
    T2: ['N', 'E', 'S'],
  };
  const SHAPE_KIND = { V: 'straight', H: 'straight', L1: 'elbow', L2: 'elbow', T1: 'T', T2: 'T' };
  const SYMMETRIC = { V: true, H: true };

  // Rulebook: 2 players 12, 3 players 10, 4 players 8 pipe cards between valve and spout.
  const REQUIRED = { 2: 12, 3: 10, 4: 8 };
  const BOARD_W = 14;
  const BOARD_H = 7;

  // Winning Moves doesn't publish the card mix. This is an estimate of the 110-card deck:
  // 4 valves + 4 spouts + 102 cards below. Edit freely.
  const DECK_SPEC = {
    iron: { V: 8, H: 8, L1: 8, L2: 8, T1: 3, T2: 3 },
    copper: { V: 6, H: 6, L1: 5, L2: 5, T1: 2, T2: 2 },
    leaky: { V: 7, H: 7, L1: 6, L2: 6, T1: 2, T2: 2 },
    caps: [
      { caps: { N: 'iron', E: 'iron', S: 'copper', W: 'iron' }, count: 3 },
      { caps: { N: 'copper', E: 'iron', S: 'iron', W: 'copper' }, count: 2 },
      { caps: { N: 'leaky', E: 'iron', S: 'copper', W: 'iron' }, count: 1 },
      { caps: { N: 'iron', E: 'leaky', S: 'iron', W: 'copper' }, count: 1 },
      { caps: { N: 'copper', E: 'iron', S: 'leaky', W: 'leaky' }, count: 1 },
    ],
  };

  // ---------- random ----------
  function nextRand(game) {
    // mulberry32, state kept in the game so saved games stay reproducible
    let t = (game.rng = (game.rng + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(game, arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(nextRand(game) * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------- cards ----------
  function buildDeck(spec) {
    spec = spec || DECK_SPEC;
    const deck = [];
    let n = 0;
    for (const mat of ['iron', 'copper', 'leaky']) {
      for (const shape of Object.keys(spec[mat])) {
        for (let k = 0; k < spec[mat][shape]; k++) deck.push({ id: 'c' + n++, kind: 'pipe', mat, shape });
      }
    }
    for (const c of spec.caps) {
      for (let k = 0; k < c.count; k++) deck.push({ id: 'c' + n++, kind: 'cap', caps: Object.assign({}, c.caps) });
    }
    return deck;
  }

  function openingsOf(card, flip) {
    if (card.kind === 'pipe') {
      const base = SHAPES[card.shape];
      return flip ? base.map((d) => OPP[d]) : base.slice();
    }
    if (card.kind === 'valve') return ['W'];
    if (card.kind === 'spout') return ['E'];
    return [];
  }
  function capAt(card, flip, d) {
    return card.caps[flip ? OPP[d] : d];
  }
  function sameSet(a, b) {
    return a.length === b.length && a.every((d) => b.includes(d));
  }
  function isGoodPipe(card) {
    return card.kind === 'pipe' && card.mat !== 'leaky';
  }
  function capHasLeak(card) {
    return card.kind === 'cap' && DIRS.some((d) => card.caps[d] === 'leaky');
  }
  function describeCard(card) {
    if (card.kind === 'cap') return capHasLeak(card) ? 'cap card (with a leaky cap)' : 'cap card';
    if (card.kind === 'valve') return 'valve';
    if (card.kind === 'spout') return 'spout';
    return card.mat + ' ' + SHAPE_KIND[card.shape];
  }

  // ---------- board ----------
  function newBoard(owner, w, h) {
    w = w || BOARD_W;
    h = h || BOARD_H;
    const cells = new Array(w * h).fill(null);
    const valve = Math.floor(h / 2) * w + (w - 1);
    cells[valve] = { card: { id: 'valve' + owner, kind: 'valve' }, flip: false, repaired: false, wrench: false, under: [], by: owner };
    return { w, h, cells, valve, last: valve, owner, spout: -1 };
  }
  function cloneBoard(b) {
    return Object.assign({}, b, { cells: b.cells.slice() });
  }
  function step(b, i, d) {
    const x = (i % b.w) + DX[d];
    const y = Math.floor(i / b.w) + DY[d];
    if (x < 0 || y < 0 || x >= b.w || y >= b.h) return -1;
    return y * b.w + x;
  }
  function pieceOpenings(p) {
    return openingsOf(p.card, p.flip);
  }
  function isPipeLike(p) {
    return p && p.card.kind !== 'cap';
  }

  // Openings that face an empty cell: places the pipeline can still grow.
  function openEnds(b) {
    const ends = [];
    for (let i = 0; i < b.cells.length; i++) {
      const p = b.cells[i];
      if (!isPipeLike(p)) continue;
      for (const d of pieceOpenings(p)) {
        const n = step(b, i, d);
        if (n < 0) ends.push({ i, d, t: -1 });
        else if (!b.cells[n]) ends.push({ i, d, t: n });
      }
    }
    return ends;
  }

  function neighborsConnected(b, i) {
    const p = b.cells[i];
    const out = [];
    if (!isPipeLike(p)) return out;
    for (const d of pieceOpenings(p)) {
      const n = step(b, i, d);
      if (n < 0) continue;
      const q = b.cells[n];
      if (isPipeLike(q) && pieceOpenings(q).includes(OPP[d])) out.push(n);
    }
    return out;
  }

  function capsInUse(b, i) {
    const p = b.cells[i];
    const used = [];
    if (!p || p.card.kind !== 'cap') return used;
    for (const d of DIRS) {
      const n = step(b, i, d);
      if (n < 0) continue;
      const q = b.cells[n];
      if (isPipeLike(q) && pieceOpenings(q).includes(OPP[d])) used.push({ d, n, mat: capAt(p.card, p.flip, d) });
    }
    return used;
  }

  function pieceLeaks(b, i) {
    const p = b.cells[i];
    if (!p || p.repaired) return false;
    if (p.card.kind === 'pipe') return p.card.mat === 'leaky';
    if (p.card.kind === 'cap') return capsInUse(b, i).some((u) => u.mat === 'leaky');
    return false;
  }
  function leakAt(b) {
    for (let i = 0; i < b.cells.length; i++) if (pieceLeaks(b, i)) return i;
    return -1;
  }

  // Longest simple path (in pipe cards, valve excluded) from the valve to cell `target`.
  // Loops are allowed by the rulebook, so every card a loop carries water through counts.
  function longestPath(b, target) {
    if (target === b.valve) return 0;
    const adj = new Map();
    for (let i = 0; i < b.cells.length; i++) if (isPipeLike(b.cells[i])) adj.set(i, neighborsConnected(b, i));
    let best = -1;
    let budget = 50000;
    const seen = new Set([b.valve]);
    (function dfs(i, len) {
      if (budget-- <= 0) return;
      if (i === target) {
        if (len > best) best = len;
        return;
      }
      for (const n of adj.get(i) || []) {
        if (seen.has(n)) continue;
        seen.add(n);
        dfs(n, len + 1);
        seen.delete(n);
      }
    })(b.valve, 0);
    return best;
  }

  function progressOf(b) {
    const ends = openEnds(b).filter((e) => e.t >= 0);
    let best = 0;
    const done = new Set();
    for (const e of ends) {
      if (done.has(e.i)) continue;
      done.add(e.i);
      best = Math.max(best, longestPath(b, e.i));
    }
    if (b.spout >= 0) {
      const into = step(b, b.spout, 'E');
      best = Math.max(best, longestPath(b, into));
    }
    return best;
  }

  // ---------- placement checks (pure geometry) ----------
  function fail(reason) {
    return { ok: false, reason };
  }

  function evalPipe(b, i, card, flip) {
    if (i < 0 || b.cells[i]) return fail('That spot is taken.');
    const O = openingsOf(card, flip);
    const conns = [];
    for (const d of DIRS) {
      const n = step(b, i, d);
      const open = O.includes(d);
      if (n < 0) {
        if (open) return fail("A pipe can't point off the edge of the table.");
        continue;
      }
      const q = b.cells[n];
      if (!q) continue;
      if (q.card.kind === 'cap') {
        if (open) return fail("A pipe can't run into a cap card.");
        continue;
      }
      const qOpen = pieceOpenings(q).includes(OPP[d]);
      if (open && qOpen) conns.push({ d, n });
      else if (open !== qOpen) return fail("The pipes don't line up.");
    }
    if (!conns.length) return fail('It has to connect to an open pipe end.');
    const nb = cloneBoard(b);
    nb.cells[i] = { card, flip, repaired: false, wrench: false, under: [], by: -1 };
    if (!openEnds(nb).length) return fail('That would completely block the pipeline.');
    return { ok: true, conns };
  }

  function evalCap(b, i, card, flip) {
    if (i < 0 || b.cells[i]) return fail('That spot is taken.');
    const used = [];
    for (const d of DIRS) {
      const n = step(b, i, d);
      if (n < 0) continue;
      const q = b.cells[n];
      if (isPipeLike(q) && pieceOpenings(q).includes(OPP[d])) used.push({ d, n, mat: capAt(card, flip, d) });
    }
    if (!used.length) return fail('A cap has to close an open pipe end.');
    const nb = cloneBoard(b);
    nb.cells[i] = { card, flip, repaired: false, wrench: false, under: [], by: -1 };
    if (!openEnds(nb).length) return fail("A cap can't stop the water: another open end must remain.");
    return { ok: true, used };
  }

  // Ends an opponent may attack: those of the last card played, or any end if that card has none left.
  function attackCells(b) {
    const ends = openEnds(b).filter((e) => e.t >= 0);
    const fromLast = ends.filter((e) => e.i === b.last);
    return new Set((fromLast.length ? fromLast : ends).map((e) => e.i));
  }

  // House rule for a gap in the rulebook: a leak may slow an opponent down, but it may not
  // steer their pipeline into a spot where it can never be finished.
  const STRAND_MSG = "House rule: a leak can't leave their pipeline with no way to finish.";
  function strandsOpponent(game, b, move, card, actor) {
    if (!analyze(b, game.required).viable) return false;
    return !analyze(boardAfter(b, move, card, actor), game.required, { budget: 4000 }).viable;
  }

  // ---------- move legality (rules for owner vs opponent) ----------
  // move: {type:'pipe'|'cap'|'cover'|'wrench'|'discard', cardId, target, i, flip}
  function checkMove(game, p, move) {
    const me = game.players[p];
    if (game.phase === 'over') return fail('The game is over.');
    if (game.turn !== p) return fail("It isn't your turn.");
    if (game.phase === 'wrenchDiscard' && move.type !== 'discard') return fail('Discard a card to finish your wrench repair.');

    if (move.type === 'wrench') {
      const b = me.board;
      const leak = leakAt(b);
      if (leak < 0) return fail('Nothing on your pipeline is leaking.');
      if (move.i !== leak) return fail('Put the wrench on the leaking card.');
      if (me.wrenches <= 0) return fail('You have no wrenches left.');
      return { ok: true };
    }

    const card = me.hand.find((c) => c.id === move.cardId);
    if (!card) return fail("That card isn't in your hand.");
    if (move.type === 'discard') return { ok: true };

    const tp = game.players[move.target];
    if (!tp) return fail('No such player.');
    const b = tp.board;
    const own = move.target === p;
    const leak = leakAt(b);

    if (move.type === 'pipe') {
      if (card.kind !== 'pipe') return fail('That is not a pipe card.');
      if (own) {
        if (card.mat === 'leaky') return fail("You can't put a leaky pipe on your own pipeline.");
        if (leak >= 0) return fail('Repair your leak before adding to your pipeline.');
        return evalPipe(b, move.i, card, move.flip);
      }
      if (card.mat !== 'leaky') return fail("You can't play a good pipe on an opponent's pipeline.");
      if (leak >= 0) return fail('That pipeline already has a leak.');
      const r = evalPipe(b, move.i, card, move.flip);
      if (!r.ok) return r;
      const atk = attackCells(b);
      if (!r.conns.some((c) => atk.has(c.n))) return fail('A leaky pipe must go next to the last card played.');
      if (strandsOpponent(game, b, move, card, p)) return fail(STRAND_MSG);
      return r;
    }

    if (move.type === 'cap') {
      if (card.kind !== 'cap') return fail('That is not a cap card.');
      const r = evalCap(b, move.i, card, move.flip);
      if (!r.ok) return r;
      if (own) {
        if (leak >= 0) {
          const lp = b.cells[leak];
          const leakyT = lp.card.kind === 'pipe' && pieceOpenings(lp).length === 3;
          if (!leakyT) return fail('Repair your leak before adding to your pipeline.');
          if (!r.used.every((u) => u.n === leak && u.mat !== 'leaky')) return fail('Only a good cap on the leaky T is allowed until it is repaired.');
        }
        return r;
      }
      if (leak >= 0) return fail('That pipeline already has a leak.');
      if (!r.used.some((u) => u.mat === 'leaky')) return fail('On an opponent you can only play a leaky cap.');
      const atk = attackCells(b);
      if (!r.used.some((u) => atk.has(u.n))) return fail('A leaky cap must go next to the last card played.');
      if (strandsOpponent(game, b, move, card, p)) return fail(STRAND_MSG);
      return r;
    }

    if (move.type === 'cover') {
      const target = b.cells[move.i];
      if (!target) return fail('There is no card there.');
      if (own) {
        if (move.i !== leak) return fail('You can only cover the leaking card.');
        if (target.card.kind === 'pipe') {
          if (!isGoodPipe(card)) return fail('Cover a leak with a good pipe of the same shape.');
          if (!sameSet(openingsOf(card, move.flip), pieceOpenings(target))) return fail('It must be exactly the same shape.');
          return { ok: true };
        }
        if (target.card.kind === 'cap') {
          if (card.kind !== 'cap') return fail('Cover a leaky cap with a good cap card.');
          const used = capsInUse(b, move.i);
          if (used.some((u) => capAt(card, move.flip, u.d) === 'leaky')) return fail('The caps in use must all be good.');
          return { ok: true };
        }
        return fail("That card can't be covered.");
      }
      if (card.kind !== 'pipe' || card.mat !== 'leaky') return fail('Only a leaky pipe can go on top of an opponent card.');
      if (leak >= 0) return fail('That pipeline already has a leak.');
      if (move.i !== b.last) return fail('A leaky pipe can only go on top of the last card played.');
      if (target.card.kind !== 'pipe') return fail('Only a pipe card can be made to leak.');
      if (target.card.mat === 'copper') return fail("Copper pipes can't leak.");
      if (target.card.mat !== 'iron' || target.repaired) return fail('A repaired pipe can\'t leak again.');
      if (!sameSet(openingsOf(card, move.flip), pieceOpenings(target))) return fail('It must be exactly the same shape.');
      return { ok: true };
    }
    return fail('Unknown move.');

  // Apply a placement to a board (no hand/turn bookkeeping). Returns the new board.
  function boardAfter(b, move, card, actor) {
    const nb = cloneBoard(b);
    if (move.type === 'pipe') {
      nb.cells[move.i] = { card, flip: !!move.flip, repaired: false, wrench: false, under: [], by: actor };
      nb.last = move.i;
    } else if (move.type === 'cap') {
      nb.cells[move.i] = { card, flip: !!move.flip, repaired: false, wrench: false, under: [], by: actor };

        card,
        flip: !!move.flip,
        repaired: ownRepair,
        wrench: false,
        under: old.under.concat([{ card: old.card, flip: old.flip, wrench: old.wrench }]),
        by: actor,

  // Returns the cell where the spout goes, or -1. Rulebook: leak-free, no second open sections,
  // at least `required` pipe cards in one line, spout pouring left and down (line ends heading left).
  function spoutCell(b, required) {
    if (leakAt(b) >= 0) return -1;

    if (ends.length !== 1) return -1;

  function analyze(b, required, opts) {

    if (!ends.length) return res;
    if (ends.some((e) => e.t < 0)) return res;

    const depth = (i) => {
      if (!depthCache.has(i)) depthCache.set(i, longestPath(b, i));

    for (const E of ends) {

      res.viable = true;

      const cost = Math.max(needed, turn) + others.size;
      if (cost < res.cost) res.cost = cost;
    }
    return res;
  }

  function pathSearch(b, E, needed, byTarget, budget) {
    const free = (i) => i >= 0 && !b.cells[i];
    const othersAt = (i) => (byTarget.get(i) || []).filter((x) => x !== E);
    const spoutOk = (s, visited) => free(s) && !visited.has(s) && !byTarget.has(s);
    // Zero more cards: spout goes straight onto this end.
    if (needed === 0 && E.d === 'W' && othersAt(E.t).length === 0) return true;
    const visited = new Set([E.t]);
    let nodes = 0;
    let exhausted = false;
    const cellOk = (i) => othersAt(i).length <= 1; // one extra end can merge through a T
    if (!free(E.t) || !cellOk(E.t)) return false;

    function reach(from, cap) {
      // count free unvisited cells reachable from `from` (stop at cap)
      const q = [from];
      const seen = new Set([from]);
      let c = 0;
      while (q.length && c < cap) {
        const i = q.pop();
        for (const d of DIRS) {
          const n = step(b, i, d);
          if (!free(n) || seen.has(n) || visited.has(n)) continue;
          seen.add(n);
          c++;
          q.push(n);
        }
      }
      return c;
    }

    function dfs(cell, len, inSide) {
      if (++nodes > budget) {
        exhausted = true;
        return true; // be optimistic when the search runs long
      }
      if (len >= needed) {
        const s = step(b, cell, 'W');
        if (inSide !== 'W' && spoutOk(s, visited)) return true;
      }
      const remaining = needed - len;
      if (remaining > 0 && reach(cell, remaining + 1) < remaining + 1) return false;
      if (len > needed + 8) return false;
      for (const d of ['W', 'N', 'S', 'E']) {
        if (d === inSide) continue;
        const n = step(b, cell, d);
        if (!free(n) || visited.has(n) || !cellOk(n)) continue;
        visited.add(n);
        if (dfs(n, len + 1, OPP[d])) return true;
        visited.delete(n);
      }
      return false;
    }
    const r = dfs(E.t, 1, OPP[E.d]);
    return r || exhausted;
  }

  // ---------- game ----------
  function newGame(opts) {
    const specs = opts.players;
    const n = specs.length;
    if (n < 2 || n > 4) throw new Error('2–4 players');
    const game = {
      v: 1,
      rng: (opts.seed >>> 0) || (Math.floor(Math.random() * 4294967296) >>> 0),
      players: specs.map((s, i) => ({ name: s.name, kind: s.kind, hand: [], wrenches: 2, board: newBoard(i, opts.w, opts.h) })),
      deck: [],
      discard: [],
      turn: 0,
      phase: 'play',
      required: REQUIRED[n],
      log: [],
      winner: null,
      turns: 0,
      drawn: null,
      seq: 0,
    };
    game.deck = shuffle(game, buildDeck(opts.deckSpec));
    for (let k = 0; k < 5; k++) for (const pl of game.players) pl.hand.push(game.deck.pop());
    game.turn = opts.first != null ? opts.first : 0;
    startTurn(game);
    return game;
  }

  const poss = (n) => (n === 'You' ? 'your' : n + "'s");
  const an = (w) => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;

  function log(game, text, kind) {
    game.seq++;
    game.log.push({ n: game.seq, text, kind: kind || 'info', p: game.turn });
    if (game.log.length > 60) game.log.shift();
  }

  function drawCard(game) {
    if (!game.deck.length && game.discard.length) {
      game.deck = shuffle(game, game.discard);
      game.discard = [];
      log(game, 'The discard pile was shuffled into a new draw pile.');
    }
    return game.deck.pop() || null;
  }

  function startTurn(game) {
    const pl = game.players[game.turn];
    game.phase = 'play';
    game.turns++;
    const c = drawCard(game);
    game.drawn = c ? c.id : null;
    if (c) pl.hand.push(c);
  }

  function removeFromHand(pl, id) {
    const k = pl.hand.findIndex((c) => c.id === id);
    return k >= 0 ? pl.hand.splice(k, 1)[0] : null;
  }

  function applyMove(game, p, move) {
    const chk = checkMove(game, p, move);
    if (!chk.ok) return chk;
    const me = game.players[p];
    const who = me.name;
    if (move.type === 'discard') {
      const c = removeFromHand(me, move.cardId);
      game.discard.push(c);
      log(game, who + ' discarded ' + an(describeCard(c)) + '.');
      return endTurn(game);
    }
    if (move.type === 'wrench') {
      me.board = boardAfter(me.board, move, null, p);
      me.wrenches--;
      game.phase = 'wrenchDiscard';
      log(game, who + ' fixed a leak with a wrench.', 'repair');
      return { ok: true, needDiscard: true };
    }
    const card = removeFromHand(me, move.cardId);
    const tp = game.players[move.target];
    tp.board = boardAfter(tp.board, move, card, p);
    const own = move.target === p;
    if (own) {
      if (move.type === 'cover') log(game, who + ' repaired a leak with ' + an(describeCard(card)) + '.', 'repair');
      else log(game, who + ' added ' + an(describeCard(card)) + '.');
    } else {
      const whom = tp.name;
      if (move.type === 'cover') log(game, who + ' made ' + poss(whom) + ' pipe leak!', 'attack');
      else log(game, who + ' put ' + an(describeCard(card)) + ' on ' + poss(whom) + ' pipeline!', 'attack');
    }
    return endTurn(game);
  }

  function endTurn(game) {
    const p = game.turn;
    const me = game.players[p];
    const s = spoutCell(me.board, game.required);
    if (s >= 0) {
      const nb = cloneBoard(me.board);
      nb.cells[s] = { card: { id: 'spout' + p, kind: 'spout' }, flip: false, repaired: false, wrench: false, under: [], by: p };
      nb.spout = s;
      me.board = nb;
      game.winner = p;
      game.phase = 'over';
      log(game, me.name + ' added the spout and ' + (me.name === 'You' ? 'win' : 'wins') + '!', 'win');
      return { ok: true, won: true };
    }
    // Everyone stuck with nothing left to draw: call it.
    if (game.turns > 600) {
      game.phase = 'over';
      game.winner = -1;
      log(game, 'The game ran out of steam. No winner.', 'win');
      return { ok: true, over: true };
    }
    game.turn = (p + 1) % game.players.length;
    startTurn(game);
    return { ok: true };
  }

  // Every legal move for player p (used by bots and to highlight targets).
  function legalMoves(game, p, onlyCardId) {
    const me = game.players[p];
    const moves = [];
    if (game.phase === 'over' || game.turn !== p) return moves;
    if (game.phase === 'wrenchDiscard') {
      for (const c of me.hand) if (!onlyCardId || c.id === onlyCardId) moves.push({ type: 'discard', cardId: c.id });
      return moves;
    }
    const seen = new Set();
    const push = (m) => {
      const key = [m.type, m.cardId, m.target, m.i, m.flip ? 1 : 0].join('|');
      if (seen.has(key)) return;
      if (checkMove(game, p, m).ok) {
        seen.add(key);
        moves.push(m);
      }
    };
    const targetsOf = (b) => [...new Set(openEnds(b).filter((e) => e.t >= 0).map((e) => e.t))];
    const flipsFor = (c) => (c.kind === 'pipe' && SYMMETRIC[c.shape] ? [false] : [false, true]);
    for (const c of me.hand) {
      if (onlyCardId && c.id !== onlyCardId) continue;
      game.players.forEach((tp, t) => {
        const b = tp.board;
        const targets = targetsOf(b);
        for (const flip of flipsFor(c)) {
          if (c.kind === 'pipe') {
            for (const i of targets) push({ type: 'pipe', cardId: c.id, target: t, i, flip });
            if (t === p) {
              const leak = leakAt(b);
              if (leak >= 0) push({ type: 'cover', cardId: c.id, target: t, i: leak, flip });
            } else push({ type: 'cover', cardId: c.id, target: t, i: b.last, flip });
          } else if (c.kind === 'cap') {
            for (const i of targets) push({ type: 'cap', cardId: c.id, target: t, i, flip });
            if (t === p) {
              const leak = leakAt(b);
              if (leak >= 0) push({ type: 'cover', cardId: c.id, target: t, i: leak, flip });
            }
          }
        }
      });
      moves.push({ type: 'discard', cardId: c.id });
    }
    if (!onlyCardId && me.wrenches > 0) {
      const leak = leakAt(me.board);
      if (leak >= 0) moves.push({ type: 'wrench', i: leak, target: p });
    }
    return moves;
  }

  // Would this own-pipeline move turn a finishable pipeline into one that can't be finished?
  function deadEndWarning(game, p, move) {
    if (move.target !== p || !['pipe', 'cap', 'cover'].includes(move.type)) return null;
    const me = game.players[p];
    const card = me.hand.find((c) => c.id === move.cardId);
    const before = analyze(me.board, game.required);
    if (!before.viable) return null;
    const after = analyze(boardAfter(me.board, move, card, p), game.required, { budget: 6000 });
    if (after.viable) return null;
    return "After this move there's no way to finish your pipeline: it can't reach a spot where the spout pours left and down with enough cards.";
  }

  const api = {
    DIRS, OPP, SHAPES, SHAPE_KIND, REQUIRED, DECK_SPEC, BOARD_W, BOARD_H,
    buildDeck, openingsOf, capAt, describeCard, capHasLeak,
    newBoard, cloneBoard, step, openEnds, capsInUse, leakAt, pieceLeaks, longestPath, progressOf,

<script>
/* Leaky Pipes computer opponent: builds toward a finishable line, caps its T's, repairs,
 * and throws leaks at whoever is closest to winning. */
(function (root) {
  'use strict';
  const LP = typeof module !== 'undefined' && module.exports ? require('./engine.js') : root.LP;

  function cost(game, b) {
    const a = LP.analyze(b, game.required);
    if (!a.viable) return Infinity;
    return a.cost + (LP.leakAt(b) >= 0 ? 1.5 : 0);
  }

  function cardById(pl, id) {
    return pl.hand.find((c) => c.id === id);
  }

  function chooseMove(game, p) {
    const me = game.players[p];
    const moves = LP.legalMoves(game, p);
    if (game.phase === 'wrenchDiscard') return { type: 'discard', cardId: worstCard(game, p, moves) };
    const rnd = () => LP.nextRand(game) * 0.01;

    const myBefore = cost(game, me.board);
    const leak = LP.leakAt(me.board);

    // 1. Repairs come first.
    if (leak >= 0) {
      const covers = moves.filter((m) => m.type === 'cover' && m.target === p);
      if (covers.length) {
        // Prefer covering with iron; keep copper for building.
        covers.sort((a, b) => (cardById(me, a.cardId).mat === 'copper') - (cardById(me, b.cardId).mat === 'copper'));
        return covers[0];
      }
      const caps = moves.filter((m) => m.type === 'cap' && m.target === p);
      let bestCap = null;
      for (const m of caps) {
        const after = cost(game, LP.boardAfter(me.board, m, cardById(me, m.cardId), p));
        if (after <= myBefore && (!bestCap || after < bestCap.after)) bestCap = { m, after };
      }
      if (bestCap) return bestCap.m;
      if (me.wrenches > 0) return { type: 'wrench', i: leak, target: p };
    }

    // 2. Building on our own pipeline.
    let bestOwn = null;
    const hasGoodCap = me.hand.some((c) => c.kind === 'cap' && !LP.capHasLeak(c));
    if (leak < 0 || moves.some((m) => m.target === p && m.type === 'cap')) {
      for (const m of moves) {
        if (m.target !== p || (m.type !== 'pipe' && m.type !== 'cap')) continue;
        const card = cardById(me, m.cardId);
        const nb = LP.boardAfter(me.board, m, card, p);
        const after = cost(game, nb);
        if (after === Infinity) continue;
        let score = (myBefore === Infinity ? 0 : myBefore) - after;
        if (myBefore === Infinity) score = 1;
        if (card.kind === 'pipe' && card.mat === 'copper') score += 0.05; // copper end can't be leaked on top
        if (card.kind === 'pipe' && LP.SHAPE_KIND[card.shape] === 'T') score += hasGoodCap ? 0.3 : -0.2;
        if (LP.spoutCell(nb, game.required) >= 0) score += 100;
        score += rnd();
        if (!bestOwn || score > bestOwn.score) bestOwn = { m, score };
      }
    }

    // 3. Attacks on opponents.
    let bestAtk = null;
    let leaderCost = Infinity;
    const oppCost = game.players.map((pl, i) => (i === p ? Infinity : cost(game, pl.board)));
    for (const c of oppCost) leaderCost = Math.min(leaderCost, c);
    for (const m of moves) {
      if (m.target === p || m.type === 'discard' || m.type === 'wrench') continue;
      const tp = game.players[m.target];
      const before = oppCost[m.target];
      if (before === Infinity) continue; // already stuck; leave them be
      const nb = LP.boardAfter(tp.board, m, cardById(me, m.cardId), p);
      const after = cost(game, nb);
      let damage = Math.min(after, before + 4) - before;
      if (tp.wrenches === 0) damage += 0.5;
      if (m.type === 'cover') damage += 0.3; // on-top leaks need the exact shape to fix
      const urgency = 1 / (1 + before);
      const score = damage * (1 + 3 * urgency) + rnd();
      if (!bestAtk || score > bestAtk.score) bestAtk = { m, score, damage, before };
    }

    const iCanFinishSoon = bestOwn && bestOwn.score >= 100;
    if (iCanFinishSoon) return bestOwn.m;
    if (bestAtk && bestAtk.damage > 0 && leaderCost <= 2 && leaderCost < myBefore) return bestAtk.m;
    if (bestOwn && bestOwn.score > 0.5) return bestOwn.m;
    if (bestAtk && bestAtk.damage > 0.5) return bestAtk.m;
    if (bestOwn && bestOwn.score > -0.1 && myBefore !== Infinity) return bestOwn.m;
    return { type: 'discard', cardId: worstCard(game, p, moves) };
  }

  // Lowest-value card in hand.
  function worstCard(game, p, moves) {
    const me = game.players[p];
    const ends = LP.openEnds(me.board).length;
    let worst = null;
    const leakyCount = me.hand.filter((c) => c.kind === 'pipe' && c.mat === 'leaky').length;
    for (const c of me.hand) {
      const playable = moves.some((m) => m.cardId === c.id && m.type !== 'discard');
      let v;
      if (c.kind === 'cap') v = ends > 1 ? 9 : 4;
      else if (c.mat === 'leaky') v = (playable ? 6 : 3) - (leakyCount > 2 ? 3 : 0);
      else if (LP.SHAPE_KIND[c.shape] === 'T') v = 3;
      else v = playable ? 7 : 4;
      if (c.kind === 'pipe' && c.mat === 'copper') v += 0.5;
      v += LP.nextRand(game) * 0.1;
      if (!worst || v < worst.v) worst = { id: c.id, v };
    }
    return worst ? worst.id : me.hand[0].id;
  }

  const api = { chooseMove };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.LP = Object.assign(root.LP || {}, { bot: api });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const LP = window.LP;
  const OPP = LP.OPP;
  const SAVE_KEY = 'leaky-pipes-v1';
  const BOT_NAMES = ['Rusty', 'Gasket', 'Spigot'];
  const CW = 50;
  const CH = 70;
  const GAP = 3;
  const BOT_DELAY = 750;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const ui = {
    game: null,
    seats: [
      { name: 'You', kind: 'human' },
      { name: 'Rusty', kind: 'bot' },
    ],
    view: 0,
    viewer: 0,
    sel: null,
    flips: {},
    wrench: false,
    busy: false,
    modal: null,
    gen: 0,
    flash: -1,
  };

  // ---------------------------------------------------------------- art
  const MID = { N: [25, 0], S: [25, 70], E: [50, 35], W: [0, 35] };
  const MAT = {
    iron: { o: '#47515a', i: '#9aa5ad', s: '#e2e8ec', r: '#6a747c' },
    copper: { o: '#73370f', i: '#cc7438', s: '#f7bf8e', r: '#9b501f' },
  };
  MAT.leaky = MAT.iron;

  function pipePath(op) {
    if (op.length === 2) {
      const [a, b] = op;
      if (OPP[a] === b) return `M${MID[a]} L${MID[b]}`;
      return `M${MID[a]} Q25,35 ${MID[b]}`;
    }
    const through = [['N', 'S'], ['E', 'W']].find(([a, b]) => op.includes(a) && op.includes(b));
    const stub = op.find((d) => !through.includes(d));
    return `M${MID[through[0]]} L${MID[through[1]]} M25,35 L${MID[stub]}`;
  }
  function ring(d, m) {
    const r = { N: [14.5, 1, 21, 6], S: [14.5, 63, 21, 6], E: [43, 24.5, 6, 21], W: [1, 24.5, 6, 21] }[d];
    return `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="1.5" fill="${m.r}" stroke="${m.o}" stroke-width="1"/>`;
  }
  function tube(path, m) {
    return (
      `<path d="${path}" fill="none" stroke="${m.o}" stroke-width="16"/>` +
      `<path d="${path}" fill="none" stroke="${m.i}" stroke-width="11.5"/>` +
      `<path d="${path}" fill="none" stroke="${m.s}" stroke-width="2.4" stroke-opacity=".75" transform="translate(-2,-2)"/>`
    );
  }
  function drop(x, y, s) {
    s = s || 1;
    return `<path d="M${x},${y - 4 * s} C${x + 3 * s},${y} ${x + 3 * s},${y + 3 * s} ${x},${y + 3 * s} C${x - 3 * s},${y + 3 * s} ${x - 3 * s},${y} ${x},${y - 4 * s}Z" fill="#3aa0e6" stroke="#e9f6ff" stroke-width=".6"/>`;
  }
  function spray(op) {
    // spray away from the pipe arms
    const free = ['N', 'E', 'S', 'W'].filter((d) => !op.includes(d));
    const d = free[0] || 'N';
    const off = { N: [[19, 12], [27, 7], [33, 14], [24, 17]], S: [[19, 56], [27, 62], [33, 55], [24, 52]], E: [[38, 26], [44, 33], [40, 42], [35, 34]], W: [[12, 26], [6, 33], [10, 42], [15, 34]] }[d];
    return off.map(([x, y], k) => drop(x, y, k % 2 ? 0.8 : 1.05)).join('') + `<path d="M21,31 L25,35 L23,38 L28,41" fill="none" stroke="#1d272e" stroke-width="1.6"/>`;
  }
  function wrenchIcon() {
    return `<g transform="translate(26 35) rotate(-38)" fill="#2b3238" stroke="#d5dde2" stroke-width="1"><rect x="-2" y="-2.6" width="21" height="5.2" rx="2.4"/><circle cx="-6" cy="0" r="6.4"/><rect x="-13.5" y="-2" width="7" height="4" fill="#b9d8ec" stroke="none"/></g>`;
  }
  function face() {
    return (
      `<rect x="1" y="1" width="48" height="68" rx="5" fill="url(#cardFace)" stroke="#8fb9d3" stroke-width="1"/>` +
      `<circle cx="8" cy="9" r="2.2" fill="#fff" opacity=".45"/><circle cx="12.5" cy="5.6" r="1.3" fill="#fff" opacity=".45"/>` +
      `<circle cx="42" cy="62" r="2" fill="#fff" opacity=".4"/><circle cx="38" cy="65.5" r="1.2" fill="#fff" opacity=".4"/>`
    );
  }
  function capArt(card, flip, usedSet) {
    let s = '';
    for (const d of ['N', 'E', 'S', 'W']) {
      const mat = LP.capAt(card, flip, d);
      const m = MAT[mat];
      const faded = usedSet && !usedSet.has(d);
      const g = {
        N: `<rect x="19" y="8" width="12" height="13" fill="${m.i}" stroke="${m.o}"/><rect x="15" y="1" width="20" height="8" rx="1.5" fill="${m.r}" stroke="${m.o}"/>`,
        S: `<rect x="19" y="49" width="12" height="13" fill="${m.i}" stroke="${m.o}"/><rect x="15" y="61" width="20" height="8" rx="1.5" fill="${m.r}" stroke="${m.o}"/>`,
        E: `<rect x="30" y="29" width="12" height="12" fill="${m.i}" stroke="${m.o}"/><rect x="41" y="25" width="8" height="20" rx="1.5" fill="${m.r}" stroke="${m.o}"/>`,
        W: `<rect x="8" y="29" width="12" height="12" fill="${m.i}" stroke="${m.o}"/><rect x="1" y="25" width="8" height="20" rx="1.5" fill="${m.r}" stroke="${m.o}"/>`,
      }[d];
      const dr = mat === 'leaky' ? { N: drop(25, 26) + drop(30, 30, 0.7), S: drop(25, 46) + drop(20, 42, 0.7), E: drop(26, 30) + drop(24, 38, 0.7), W: drop(24, 30) + drop(26, 38, 0.7) }[d] : '';
      s += `<g opacity="${faded ? 0.3 : 1}">${g}${dr}</g>`;
    }
    return s;
  }
  function valveArt() {
    const m = MAT.iron;
    return (
      tube('M0,35 L27,35', m) +
      ring('W', m) +
      `<rect x="22" y="25" width="11" height="20" rx="2" fill="#8d979e" stroke="#47515a"/>` +
      `<rect x="32" y="32.5" width="7" height="5" fill="#7c868d" stroke="#47515a" stroke-width=".8"/>` +
      `<ellipse cx="42" cy="35" rx="4.5" ry="15" fill="#c8372b" stroke="#7d1c14" stroke-width="1.2"/>` +
      `<path d="M42,21 L42,49 M38.5,27 L45.5,43 M45.5,27 L38.5,43" stroke="#7d1c14" stroke-width="1.2"/>`
    );
  }
  function spoutArt() {
    const m = MAT.copper;
    return (
      tube('M50,35 L36,35 Q23,35 23,48 L23,51', m) +
      ring('E', m) +
      `<rect x="16" y="50" width="14" height="9" rx="1.5" fill="${m.r}" stroke="${m.o}"/>` +
      `<path d="M17,53 H29 M17,56 H29" stroke="${m.o}" stroke-width=".8"/>` +
      drop(20, 64, 0.9) + drop(26, 66, 0.8) + drop(23, 69, 0.6)
    );
  }
  // piece: {card, flip, repaired, wrench}; opts.usedCaps (Set) for cap cards on a board
  function cardArt(piece, opts) {
    opts = opts || {};
    const c = piece.card;
    let s = face();
    if (c.kind === 'valve') return s + valveArt();
    if (c.kind === 'spout') return s + spoutArt();
    if (c.kind === 'cap') return s + capArt(c, piece.flip, opts.usedCaps) + (piece.wrench ? wrenchIcon() : '');
    const op = LP.openingsOf(c, piece.flip);
    const m = MAT[c.mat];
    s += tube(pipePath(op), m);
    if (op.length === 3) s += `<circle cx="25" cy="35" r="9.5" fill="${m.i}" stroke="${m.o}" stroke-width="1.6"/><circle cx="23" cy="33" r="3" fill="${m.s}" opacity=".55"/>`;
    s += op.map((d) => ring(d, m)).join('');
    if (c.mat === 'copper') s += `<rect x="20" y="31" width="10" height="8" rx="2" fill="none" stroke="${m.o}" stroke-width=".6" opacity=".5"/>`;
    if (c.mat === 'leaky' && !piece.repaired) s += spray(op);
    if (piece.wrench) s += wrenchIcon();
    return s;
  }
  function cardSVG(card, flip, extraClass) {
    return `<svg viewBox="0 0 50 70" class="${extraClass || ''}" aria-hidden="true">${cardArt({ card, flip, repaired: false, wrench: false })}</svg>`;
  }
  function cardLabel(card, flip) {
    if (card.kind === 'cap') return LP.describeCard(card);
    const names = { N: 'up', S: 'down', E: 'right', W: 'left' };
    return LP.describeCard(card) + ', open ' + LP.openingsOf(card, flip).map((d) => names[d]).join(' and ');
  }
  const ICON = {
    wrench: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.6 17.1a1.6 1.6 0 0 0 2.3 2.3l5.7-5.7a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.3-.6-.6-2.3z" fill="currentColor"/></svg>',
    drop: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z" fill="currentColor"/></svg>',
    turn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // ---------------------------------------------------------------- persistence
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ game: ui.game, seats: ui.seats, viewer: ui.viewer }));
    } catch (e) {
      /* storage unavailable: play on without saving */
    }
  }
  function loadSaved() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.game || !d.game.players) return null;
      return d;
    } catch (e) {
      return null;
    }
  }

  // ---------------------------------------------------------------- helpers
  const G = () => ui.game;
  const humans = () => G().players.filter((p) => p.kind === 'human').length;
  const isHumanTurn = () => G() && G().phase !== 'over' && G().players[G().turn].kind === 'human' && !ui.modal && !ui.busy;
  const handOwner = () => ui.viewer;

  function selMoves() {
    if (!ui.sel || !isHumanTurn()) return [];
    const g = G();
    const key = [ui.sel, g.turn, g.seq, g.phase].join('|');
    if (ui._mv && ui._mv.key === key) return ui._mv.list;
    const list = LP.legalMoves(g, g.turn, ui.sel).filter((m) => m.type !== 'discard');
    ui._mv = { key, list };
    return list;
  }
  function closeModal() {
    const m = ui.modal;
    if (m && m.type === 'rules' && m.back && m.back.type === 'setup') {
      ui.modal = m.back;
      return render();
    }
    ui.modal = null;
    if (G()) return proceed();
    render();
  }
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast.h);
    toast.h = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------------------------------------------------------------- rendering
  function render() {
    if (!G()) return renderOverlay();
    renderMeta();
    renderChips();
    renderBoard();
    renderStatus();
    renderHand();
    renderActions();
    renderOverlay();
  }

  function renderMeta() {
    const g = G();
    $('meta').textContent = `Deck ${g.deck.length} · Need ${g.required}`;
  }

  function renderChips() {
    const g = G();
    const moves = selMoves();
    const playable = new Set(moves.map((m) => m.target));
    if (ui.wrench) playable.add(g.turn);
    $('chips').innerHTML = g.players
      .map((pl, i) => {
        const b = pl.board;
        const prog = Math.min(LP.progressOf(b), g.required);
        const leak = LP.leakAt(b) >= 0;
        const dead = g.phase !== 'over' && !LP.analyze(b, g.required).viable;
        const wr = Array.from({ length: pl.wrenches }, () => ICON.wrench).join('');
        const cls = ['chip', i === ui.view ? 'viewing' : '', i === g.turn && g.phase !== 'over' ? 'turn' : '', playable.has(i) ? 'can-play' : '', i === ui.flash ? 'flash' : ''].join(' ');
        const tags = [wr ? `<span title="Wrenches left">${wr}</span>` : '<span>no wrenches</span>', leak ? `<span class="tag-leak">${ICON.drop} leak</span>` : '', dead ? '<span class="tag-dead">dead end</span>' : '', g.winner === i ? '<span class="tag-leak">winner</span>' : ''].join('');
        return `<button type="button" class="${cls}" data-view="${i}" aria-pressed="${i === ui.view}">
          <span class="nm">${esc(pl.name)}</span><span class="ct">${prog}/${g.required}</span>
          <span class="bar"><i style="width:${(100 * prog) / g.required}%"></i></span>
          <span class="tags">${tags}</span></button>`;
      })
      .join('');
    ui.flash = -1;
  }

  function renderBoard() {
    const g = G();
    const pl = g.players[ui.view];
    const b = pl.board;
    const W = b.w * CW + (b.w - 1) * GAP;
    const H = b.h * CH + (b.h - 1) * GAP;
    const svg = $('board');
    const wrap = $('boardwrap');
    const v = computeView(b, Math.max(0.3, (wrap.clientWidth - 20) / Math.max(1, wrap.clientHeight - 20)));
    svg.setAttribute('viewBox', `${v.x - 5} ${v.y - 5} ${v.w + 10} ${v.h + 10}`);
    svg.setAttribute('aria-label', pl.name + "'s pipeline");
    $('viewnote').textContent = ui.view === ui.viewer && pl.kind === 'human' && humans() === 1 ? 'Your pipeline' : pl.name + "'s pipeline";

    const targets = new Map(); // i -> {solid}
    const want = ui.sel ? !!ui.flips[ui.sel] : false;
    for (const m of selMoves()) {
      if (m.target !== ui.view) continue;
      const t = targets.get(m.i) || { solid: false };
      if (!!m.flip === want || isSymmetric(ui.sel)) t.solid = true;
      targets.set(m.i, t);
    }
    if (ui.wrench && ui.view === g.turn) {
      const lk = LP.leakAt(b);
      if (lk >= 0) targets.set(lk, { solid: true });
    }

    const leak = LP.leakAt(b);
    let out = `<rect class="tableedge" x="-3" y="-3" width="${W + 6}" height="${H + 6}" rx="7"/>`;
    for (let i = 0; i < b.cells.length; i++) {
      const x = (i % b.w) * (CW + GAP);
      const y = Math.floor(i / b.w) * (CH + GAP);
      const p = b.cells[i];
      if (p) {
        const used = p.card.kind === 'cap' ? new Set(LP.capsInUse(b, i).map((u) => u.d)) : null;
        out += `<g transform="translate(${x} ${y})">${cardArt(p, { usedCaps: used })}</g>`;
      } else {
        out += `<rect class="slot" x="${x + 1.5}" y="${y + 1.5}" width="${CW - 3}" height="${CH - 3}" rx="5"/>`;
      }
    }
    for (let i = 0; i < b.cells.length; i++) {
      const x = (i % b.w) * (CW + GAP);
      const y = Math.floor(i / b.w) * (CH + GAP);
      if (i === leak) out += `<rect class="leakring" x="${x - 1}" y="${y - 1}" width="${CW + 2}" height="${CH + 2}" rx="6"/>`;
      const t = targets.get(i);
      if (t) out += `<rect class="target${t.solid ? '' : ' flipneed'}" x="${x + 1}" y="${y + 1}" width="${CW - 2}" height="${CH - 2}" rx="5"/>`;
      if (ui.view !== ui.viewer && i === b.last && g.phase !== 'over') out += `<path class="lastmark" d="M${x + CW - 14},${y + 2} h12 v12 z"><title>Last card played</title></path>`;
      out += `<rect class="hit${t ? ' go' : ''}" data-i="${i}" x="${x}" y="${y}" width="${CW}" height="${CH}"/>`;
    }
    svg.innerHTML = out;
  }
  // Zoom to the part of the table in use (plus a free ring around it), shaped to the screen,
  // so cards stay big on a phone. Grows as the pipeline grows.
  function computeView(b, aspect) {
    let x0 = b.w, x1 = 0, y0 = b.h, y1 = 0;
    b.cells.forEach((p, i) => {
      if (!p) return;
      const x = i % b.w;
      const y = Math.floor(i / b.w);
      x0 = Math.min(x0, x); x1 = Math.max(x1, x);
      y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    });
    x0 = Math.max(0, x0 - 1); x1 = Math.min(b.w - 1, x1 + 1);
    y0 = Math.max(0, y0 - 1); y1 = Math.min(b.h - 1, y1 + 1);
    const addCol = () => (x0 > 0 ? x0-- : x1++);
    let flipRow = false;
    const addRow = () => {
      flipRow = !flipRow;
      if ((flipRow && y0 > 0) || y1 >= b.h - 1) y0--;
      else y1++;
    };
    while (x1 - x0 + 1 < Math.min(6, b.w)) addCol();
    while (y1 - y0 + 1 < Math.min(5, b.h)) addRow();
    const px = () => ({ w: (x1 - x0 + 1) * CW + (x1 - x0) * GAP, h: (y1 - y0 + 1) * CH + (y1 - y0) * GAP });
    let s = px();
    if (s.w / s.h < aspect) {
      while (s.w / s.h < aspect && x1 - x0 + 1 < b.w) { addCol(); s = px(); }
    } else {
      while (s.w / s.h > aspect && y1 - y0 + 1 < b.h) { addRow(); s = px(); }
    }
    return { x: x0 * (CW + GAP), y: y0 * (CH + GAP), w: s.w, h: s.h };
  }
  window.addEventListener('resize', () => G() && renderBoard());

  function isSymmetric(cardId) {
    const c = findCard(cardId);
    return c && c.kind === 'pipe' && (c.shape === 'V' || c.shape === 'H');
  }
  function findCard(id) {
    const g = G();
    for (const p of g.players) {
      const c = p.hand.find((h) => h.id === id);
      if (c) return c;
    }
    return null;
  }

  function renderStatus() {
    const g = G();
    const cur = g.players[g.turn];
    let prompt;
    if (g.phase === 'over') prompt = g.winner >= 0 ? `${g.players[g.winner].name} connected the spout.` : 'Game over.';
    else if (ui.busy) prompt = `${cur.name} is playing…`;
    else if (g.phase === 'wrenchDiscard') prompt = 'Wrench placed. Pick a card to discard to finish your turn.';
    else if (ui.wrench) prompt = 'Tap the leaking card to put your wrench on it.';
    else if (ui.sel) {
      const n = selMoves().length;
      const viewName = ui.view === g.turn ? 'your pipeline' : g.players[ui.view].name + "'s pipeline";
      const here = selMoves().filter((m) => m.target === ui.view).length;
      prompt = !n ? "That card can't be played right now. Discard it or pick another." : here ? `Tap a glowing slot on ${viewName}.` : 'That card goes on another pipeline. Tap a highlighted name.';
    } else {
      const mine = g.players[g.turn].board;
      prompt = LP.leakAt(mine) >= 0 ? 'Your pipeline is leaking. Cover the leak with the same shape, use a wrench, or discard.' : `${humans() > 1 ? cur.name + ', your' : 'Your'} turn. Pick a card.`;
    }
    const logs = g.log.slice(-2).reverse();
    $('status').innerHTML = `<div class="prompt">${esc(prompt)}</div>` + logs.map((l) => `<div class="log ${l.kind}">${esc(l.text)}</div>`).join('');
  }

  function renderHand() {
    const g = G();
    const el = $('hand');
    if (ui.modal && ui.modal.type === 'pass') {
      el.innerHTML = '<div class="hidden">Cards hidden until the next player is ready.</div>';
      return;
    }
    const owner = g.players[handOwner()];
    const myTurn = isHumanTurn() && g.turn === handOwner();
    el.innerHTML = owner.hand
      .map((c) => {
        const flip = !!ui.flips[c.id];
        const cls = ['hcard', ui.sel === c.id ? 'sel' : '', myTurn && g.drawn === c.id ? 'new' : '', myTurn ? '' : 'dim'].join(' ');
        return `<button type="button" class="${cls}" data-card="${c.id}" ${myTurn ? '' : 'disabled'} aria-pressed="${ui.sel === c.id}" aria-label="${esc(cardLabel(c, flip))}">${cardSVG(c, flip)}</button>`;
      })
      .join('');
  }

  function renderActions() {
    const g = G();
    const myTurn = isHumanTurn();
    const me = g.players[g.turn];
    const c = ui.sel ? findCard(ui.sel) : null;
    const canTurn = myTurn && c && !(c.kind === 'pipe' && (c.shape === 'V' || c.shape === 'H')) && g.phase === 'play';
    const leak = myTurn && LP.leakAt(me.board) >= 0;
    const canWrench = myTurn && g.phase === 'play' && leak && me.wrenches > 0;
    const discardLabel = g.phase === 'wrenchDiscard' ? 'Discard to finish' : 'Discard';
    $('actions').innerHTML =
      `<button type="button" class="btn" data-act="turn" ${canTurn ? '' : 'disabled'}>${ICON.turn}Turn card</button>` +
      `<button type="button" class="btn" data-act="discard" ${myTurn && c ? '' : 'disabled'}>${ICON.bin}${discardLabel}</button>` +
      `<button type="button" class="btn ${ui.wrench ? 'on' : ''}" data-act="wrench" ${canWrench ? '' : 'disabled'}>${ICON.wrench}Wrench (${me.kind === 'human' ? me.wrenches : g.players[ui.viewer].wrenches})</button>`;
  }

  // ---------------------------------------------------------------- overlays
  function renderOverlay() {
    const o = $('overlay');
    const m = ui.modal;
    if (!m) {
      o.innerHTML = '';
      return;
    }
    if (m.type === 'setup') o.innerHTML = setupHTML();
    else if (m.type === 'pass') o.innerHTML = passHTML();
    else if (m.type === 'warn') o.innerHTML = warnHTML(m);
    else if (m.type === 'over') o.innerHTML = overHTML();
    else if (m.type === 'rules') o.innerHTML = rulesHTML();
    else if (m.type === 'menu') o.innerHTML = menuHTML();
    const first = o.querySelector('[data-focus]') || o.querySelector('button');
    if (first) first.focus({ preventScroll: true });
  }

  function heroCards() {
    const mk = (card, flip) => cardSVG(card, flip);
    return `<div class="hero-art" aria-hidden="true">${mk({ kind: 'spout' })}${mk({ kind: 'pipe', mat: 'iron', shape: 'H' })}${mk({ kind: 'pipe', mat: 'leaky', shape: 'L1' }, true)}${mk({ kind: 'pipe', mat: 'copper', shape: 'T1' })}${mk({ kind: 'pipe', mat: 'iron', shape: 'H' })}${mk({ kind: 'valve' })}</div>`;
  }

  function setupHTML() {
    const s = ui.seats;
    const saved = loadSaved();
    const canResume = saved && saved.game.phase !== 'over' && !ui.game;
    const inGame = ui.game && ui.game.phase !== 'over';
    const need = LP.REQUIRED[s.length];
    const seats = s
      .map(
        (seat, i) => `<div class="seat">
        <input id="seat-name-${i}" value="${esc(seat.name)}" maxlength="14" aria-label="Player ${i + 1} name" data-seat="${i}">
        <span class="seg" role="group" aria-label="Player ${i + 1} type">
          <button type="button" class="${seat.kind === 'human' ? 'on' : ''}" data-kind="${i}:human">Person</button>
          <button type="button" class="${seat.kind === 'bot' ? 'on' : ''}" data-kind="${i}:bot">Computer</button>
        </span>
        ${s.length > 2 ? `<button type="button" class="x" data-remove="${i}" aria-label="Remove player ${i + 1}">×</button>` : '<span></span>'}
      </div>`
      )
      .join('');
    const hasHuman = s.some((x) => x.kind === 'human');
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setup-h">
      ${heroCards()}
      <h2 id="setup-h">Leaky <span>Pipes</span></h2>
      <p>Race to pipe water from your valve to your spout while everyone else springs leaks in your line. Classic Waterworks rules for 2 to 4 players.</p>
      ${canResume ? `<div class="row"><button type="button" class="btn primary" data-act="resume" data-focus>Resume saved game</button></div>` : ''}
      ${inGame ? `<div class="row"><button type="button" class="btn" data-act="close">Back to the current game</button></div>` : ''}
      <h3>Players</h3>
      ${seats}
      <div class="row">${s.length < 4 ? '<button type="button" class="btn" data-act="add-seat">Add a player</button>' : ''}</div>
      <p class="muted">${s.length} players · ${need} pipe cards to win. Pass-and-play: give each person their own seat and pass the device between turns.</p>
      ${hasHuman ? '' : '<p class="muted" style="color:var(--danger)">Add at least one person.</p>'}
      <div class="row end">
        <button type="button" class="btn" data-act="rules">How to play</button>
        <button type="button" class="btn ${canResume ? '' : 'primary'}" data-act="start" ${hasHuman ? '' : 'disabled'} ${canResume ? '' : 'data-focus'}>Start new game</button>
      </div>
    </div>`;
  }

  function passHTML() {
    const name = G().players[G().turn].name;
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pass-h">
      <h2 id="pass-h">Pass to <span>${esc(name)}</span></h2>
      <p>Hands are hidden so nobody peeks. ${esc(G().log.length ? G().log[G().log.length - 1].text : '')}</p>
      <div class="row end"><button type="button" class="btn primary" data-act="pass-ok" data-focus>I'm ${esc(name)}. Show my cards</button></div>
    </div>`;
  }

  function warnHTML(m) {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="warn-h">
      <h2 id="warn-h">Dead end <span>ahead</span></h2>
      <p>${esc(m.text)}</p>
      <p class="muted">The rulebook lets you make this move. Once it's down, it can't be moved.</p>
      <div class="row end">
        <button type="button" class="btn" data-act="warn-no" data-focus>Pick something else</button>
        <button type="button" class="btn danger" data-act="warn-yes">Place it anyway</button>
      </div>
    </div>`;
  }

  function overHTML() {
    const g = G();
    const w = g.winner;
    const title = w < 0 ? 'No <span>winner</span>' : g.players[w].kind === 'human' && humans() === 1 ? 'You <span>win!</span>' : `${esc(g.players[w].name)} <span>wins</span>`;
    const rounds = Math.ceil(g.turns / g.players.length);
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="over-h">
      <h2 id="over-h">${title}</h2>
      <p>${w >= 0 ? `A leak-free line of ${LP.progressOf(g.players[w].board)} pipes from valve to spout, in ${rounds} rounds.` : 'Nobody could finish.'}</p>
      <div class="row end">
        <button type="button" class="btn" data-act="see-board">Look at the table</button>
        <button type="button" class="btn" data-act="setup">Change players</button>
        <button type="button" class="btn primary" data-act="again" data-focus>Play again</button>
      </div>
    </div>`;
  }

  function menuHTML() {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-h">
      <h2 id="menu-h">Menu</h2>
      <div class="row">
        <button type="button" class="btn" data-act="rules">How to play</button>
        <button type="button" class="btn" data-act="setup">New game</button>
        <button type="button" class="btn primary" data-act="close" data-focus>Back to the game</button>
      </div>
    </div>`;
  }

  function rulesHTML() {
    return `<div class="sheet rules" role="dialog" aria-modal="true" aria-labelledby="rules-h">
      <h2 id="rules-h">How to <span>play</span></h2>
      <h3>Goal</h3>
      <p>Build a leak-free line from your valve to your spout with at least 12, 10 or 8 pipe cards (2, 3 or 4 players). Caps don't count.</p>
      <h3>Your turn</h3>
      <p>You draw a card automatically. Then do one thing: add a good pipe (copper or iron) to your pipeline, put a leaky pipe or leaky cap on an opponent, repair a leak, or discard. You end with five cards.</p>
      <h3>Placing</h3>
      <p>The valve sits on the right and you build leftward. Cards stay upright; Turn card spins one 180°. Pipes must line up on every side, nothing may point off the table, and no card may completely block a pipeline. Loops are fine as long as the pipeline can keep going.</p>
      <h3>Leaks</h3>
      <p>A leaky card goes next to the last card of an opponent's pipeline (marked with a copper corner), or on top of it if that card is iron and exactly the same shape. Copper never leaks. One leak per pipeline at a time, and a repaired pipe can't leak again.</p>
      <h3>Repairs</h3>
      <p>Cover the leak with a good card of the same shape, or use one of your two wrenches and then discard a card. Until it's fixed you can't build, except to put a good cap on one end of a leaky T.</p>
      <h3>T's and caps</h3>
      <p>A T splits the water. Before you can win, cap one end or loop it back into the line. Caps that don't touch a pipe are ignored; a leaky cap in use has to be repaired. You can't cap your last open end.</p>
      <h3>Winning</h3>
      <p>When your line is long enough, leak-free, has no other open ends and its last pipe points left, the spout goes on automatically, pouring left and down.</p>
      <h3>House rules in this app</h3>
      <p class="muted">A leak can't leave someone's pipeline with no way to finish (the rulebook doesn't cover this). You get a warning before a move that would do that to your own pipeline. Pipes can't be run into a cap card that's already down. Winning Moves doesn't publish its card mix, so the 110-card deck here is an estimate.</p>
      <div class="row end"><button type="button" class="btn primary" data-act="rules-close" data-focus>Got it</button></div>
    </div>`;
  }

  // ---------------------------------------------------------------- game flow
  function startGame(seats) {
    ui.gen++;
    const players = seats.map((s, i) => ({ name: (s.name || '').trim() || (s.kind === 'bot' ? BOT_NAMES[i % 3] : 'Player ' + (i + 1)), kind: s.kind }));
    ui.game = LP.newGame({ players });
    ui.sel = null;
    ui.flips = {};
    ui.wrench = false;
    ui.busy = false;
    ui.modal = null;
    const firstHuman = players.findIndex((p) => p.kind === 'human');
    ui.viewer = firstHuman;
    ui.view = firstHuman;
    save();
    proceed(true);
  }

  function proceed(fresh) {
    const g = G();
    render();
    if (g.phase === 'over') {
      ui.busy = false;
      ui.view = g.winner >= 0 ? g.winner : ui.view;
      ui.modal = { type: 'over' };
      return render();
    }
    const cur = g.players[g.turn];
    if (cur.kind === 'bot') {
      ui.busy = true;
      ui.sel = null;
      ui.wrench = false;
      render();
      const gen = ui.gen;
      setTimeout(() => gen === ui.gen && botStep(), fresh ? 400 : BOT_DELAY);
      return;
    }
    ui.busy = false;
    if (humans() > 1 && ui.viewer !== g.turn) {
      ui.modal = { type: 'pass' };
      return render();
    }
    ui.viewer = g.turn;
    ui.view = g.turn;
    render();
  }

  function botStep() {
    const g = G();
    if (!g || g.phase === 'over') return proceed();
    const p = g.turn;
    let m = LP.bot.chooseMove(g, p);
    let r = LP.applyMove(g, p, m);
    if (!r.ok) r = LP.applyMove(g, p, { type: 'discard', cardId: g.players[p].hand[0].id });
    if (m.target != null && m.target !== p) {
      ui.flash = m.target;
      if (m.target === ui.viewer) toast(g.log[g.log.length - 1].text);
    }
    save();
    if (g.phase === 'wrenchDiscard') {
      render();
      const gen = ui.gen;
      setTimeout(() => gen === ui.gen && botStep(), 450);
      return;
    }
    proceed();
  }

  function play(m) {
    const g = G();
    const r = LP.applyMove(g, g.turn, m);
    if (!r.ok) {
      toast(r.reason);
      return;
    }
    if (m.cardId) delete ui.flips[m.cardId];
    ui.sel = null;
    ui.wrench = false;
    save();
    if (g.phase === 'wrenchDiscard') return render();
    proceed();
  }

  function tryCell(i) {
    const g = G();
    if (!isHumanTurn()) return;
    if (ui.wrench) {
      if (ui.view === g.turn && LP.leakAt(g.players[g.turn].board) === i) play({ type: 'wrench', i, target: g.turn });
      else toast('Tap the leaking card on your own pipeline.');
      return;
    }
    if (!ui.sel) {
      const p = g.players[ui.view].board.cells[i];
      if (p) toast(cardLabel(p.card, p.flip).replace(/^./, (c) => c.toUpperCase()) + '.');
      return;
    }
    if (g.phase !== 'play') return;
    const want = !!ui.flips[ui.sel];
    const here = selMoves().filter((m) => m.target === ui.view && m.i === i);
    if (!here.length) {
      toast(whyNot(i, want));
      return;
    }
    const m = here.find((x) => !!x.flip === want) || here[0];
    if (!!m.flip !== want) ui.flips[ui.sel] = !!m.flip;
    const warn = LP.deadEndWarning(g, g.turn, m);
    if (warn) {
      ui.modal = { type: 'warn', text: warn, move: m };
      return render();
    }
    play(m);
  }

  function whyNot(i, flip) {
    const g = G();
    const card = findCard(ui.sel);
    const b = g.players[ui.view].board;
    const occupied = !!b.cells[i];
    const type = occupied ? 'cover' : card.kind === 'cap' ? 'cap' : 'pipe';
    const r = LP.checkMove(g, g.turn, { type, cardId: ui.sel, target: ui.view, i, flip });
    if (r.ok) return 'Try turning the card.';
    if (!occupied && !LP.openEnds(b).some((e) => e.t === i)) return 'Cards have to attach to an open pipe end.';
    return r.reason;
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-act],[data-card],[data-view],[data-i],[data-kind],[data-remove]');
    if (!t) return;
    if (t.dataset.i != null && t.closest('#board')) return tryCell(+t.dataset.i);
    if (t.dataset.view != null) {
      ui.view = +t.dataset.view;
      return render();
    }
    if (t.dataset.card) {
      if (!isHumanTurn()) return;
      ui.wrench = false;
      ui.sel = ui.sel === t.dataset.card ? null : t.dataset.card;
      if (ui.sel && G().phase === 'play') {
        const ms = selMoves();
        if (ms.length && !ms.some((m) => m.target === ui.view)) ui.view = ms[0].target;
      }
      return render();
    }
    if (t.dataset.kind) {
      const [i, k] = t.dataset.kind.split(':');
      const seat = ui.seats[+i];
      if (seat.kind !== k) {
        seat.kind = k;
        if (k === 'bot' && (/^(You|Player \d)$/.test(seat.name) || !seat.name)) seat.name = BOT_NAMES[(+i + 2) % 3];
        if (k === 'human' && BOT_NAMES.includes(seat.name)) seat.name = 'Player ' + (+i + 1);
      }
      return renderOverlay();
    }
    if (t.dataset.remove) {
      ui.seats.splice(+t.dataset.remove, 1);
      return renderOverlay();
    }
    const act = t.dataset.act;
    const g = G();
    switch (act) {
      case 'turn':
        if (ui.sel) ui.flips[ui.sel] = !ui.flips[ui.sel];
        return render();
      case 'discard':
        if (ui.sel && isHumanTurn()) play({ type: 'discard', cardId: ui.sel });
        return;
      case 'wrench':
        ui.wrench = !ui.wrench;
        ui.sel = null;
        if (ui.wrench) ui.view = g.turn;
        return render();
      case 'add-seat': {
        const n = ui.seats.length;
        ui.seats.push({ name: BOT_NAMES[(n - 1) % 3], kind: 'bot' });
        return renderOverlay();
      }
      case 'start':
        readSeatNames();
        return startGame(ui.seats);
      case 'resume': {
        const d = loadSaved();
        if (!d) return;
        ui.gen++;
        ui.game = d.game;
        ui.seats = d.seats || ui.seats;
        ui.viewer = d.viewer || 0;
        ui.view = ui.viewer;
        ui.modal = null;
        return proceed(true);
      }
      case 'rules':
        readSeatNames();
        ui.modal = { type: 'rules', back: ui.modal };
        return render();
      case 'rules-close':
        return closeModal();
      case 'setup':
        ui.gen++;
        ui.busy = false;
        ui.modal = { type: 'setup' };
        return render();
      case 'close':
        ui.modal = null;
        return G() ? proceed() : render();
      case 'pass-ok':
        ui.modal = null;
        ui.viewer = g.turn;
        ui.view = g.turn;
        return render();
      case 'warn-no':
        ui.modal = null;
        return render();
      case 'warn-yes': {
        const m = ui.modal.move;
        ui.modal = null;
        return play(m);
      }
      case 'again':
        ui.seats = G().players.map((p) => ({ name: p.name, kind: p.kind }));
        return startGame(ui.seats);
      case 'see-board':
        ui.modal = null;
        return render();
    }
  });
  $('menuBtn').addEventListener('click', () => {
    if (!G()) {
      ui.modal = { type: 'setup' };
      return render();
    }
    if (ui.modal && ui.modal.type === 'over') return;
    ui.gen++; // pause bots while the menu is open
    ui.busy = false;
    ui.modal = G().phase === 'over' ? { type: 'over' } : { type: 'menu' };
    render();
  });
  document.addEventListener('input', (ev) => {
    const i = ev.target.dataset && ev.target.dataset.seat;
    if (i != null) ui.seats[+i].name = ev.target.value;
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && ui.modal && ['rules', 'menu', 'warn'].includes(ui.modal.type)) closeModal();
  });
  function readSeatNames() {
    document.querySelectorAll('[data-seat]').forEach((inp) => {
      ui.seats[+inp.dataset.seat].name = inp.value;
    });
  }

  // ---------------------------------------------------------------- boot
  const saved = loadSaved();
  if (saved && saved.seats) ui.seats = saved.seats;
  ui.modal = { type: 'setup' };
  if (saved && saved.game && saved.game.phase !== 'over') {
    // Show the saved table behind the setup sheet.
    ui.game = null;
  }
  render();
  window.__leaky = ui; // handy for debugging
})();

</script>
</body>
</html>
